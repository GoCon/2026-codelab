[[campaignTiers.stages]]
id = "fill-builtin-infinite-loop"
kind = "fill"
label = { ja = "builtin", en = "builtin" }
title = { ja = "無限ループの作成", en = "Creating an Infinite Loop" }
prompt = { ja = "Go で無限ループを作るためのキーワードを埋めてください。", en = "Fill in the keyword used to create an infinite loop in Go." }
outputLines = """
"""
why = { ja = "Go には `while` や `loop` といったキーワードは存在せず、繰り返し構文はすべて `for` に統一されています。", en = "Go does not have `while` or `loop` keywords; all iteration syntax is unified strictly under `for`." }
takeaway = { ja = "`for` の条件式を省略して `for {}` と書くだけで、もっともシンプルでスッキリとした無限ループを作成できます。", en = "Simply omitting the condition by writing `for {}` is the cleanest and idiomatic way to create an infinite loop." }
templateLines = """
[1] {
  // 無限ループ
}
"""
pool = [ "for", "while", "loop", "(true)", "True:" ]
correctAnswers = [ "for" ]

