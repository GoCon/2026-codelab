correctAnswers = [ "<-chan", "<-" ]

[[campaignTiers.stages]]
id = "fill-unsafe-sizeof-struct"
kind = "fill"
label = { ja = "unsafe", en = "unsafe" }
title = { ja = "0バイトの構造体", en = "0-byte Struct" }
prompt = { ja = "配列全体の占めるバイト数（出力）が 0 になるように型を埋めてください。", en = "Fill in the type so that the total byte size of the array output evaluates to 0." }
outputLines = """
0
"""
playgroundUrl = "https://go.dev/play/p/QZNiYpYMAMt"
why = { ja = "`struct{}`（空の構造体）はサイズが 0 バイトの特殊な型です。そのため、要素数が1億個あっても配列全体のサイズは 0 バイトになります。", en = "`struct{}` (an empty struct) is a special type with a size of exactly 0 bytes. Thus, even an array of 100 million elements consumes 0 bytes." }
takeaway = { ja = "`unsafe.Sizeof` で確認すると、`struct{}` の配列はメモリを一切消費しないことが分かります。値を持たない「セット（集合）」を実装する際によく使われます。", en = "Using `unsafe.Sizeof` reveals that a `struct{}` array consumes no memory. It's often used to implement 'sets' that only denote presence without values." }
templateLines = """
var arr [100_000_000][1]
fmt.Println(unsafe.Sizeof(arr))
"""
pool = [ "struct{}", "any", "bool", "byte", "0" ]
correctAnswers = [ "struct{}" ]

[[campaignTiers.stages]]
id = "fill-unsafe-pointer-conversion"
kind = "fill"
label = { ja = "unsafe", en = "unsafe" }
title = { ja = "ポインタの型変換", en = "Pointer Type Conversion" }
prompt = { ja = "int型のポインタをfloat64型のポインタに変換する 2 か所。", en = "Fill in the 2 blanks to convert an int pointer to a float64 pointer." }
outputLines = """
"""
playgroundUrl = "https://go.dev/play/p/oXl7EN0oW5T"
why = { ja = "Goでは異なるポインタ型同士を直接キャストできませんが、`unsafe.Pointer` を経由することで任意のポインタ型に無理やり変換できます。", en = "In Go, you cannot cast directly between different pointer types, but you can force the conversion by routing it through `unsafe.Pointer`." }
takeaway = { ja = "安全性を犠牲にして型を変換する際は、`unsafe.Pointer` と目的のポインタ型（`*float64` など）を組み合わせます。", en = "When bypassing type safety to convert types, combine `unsafe.Pointer` with your target pointer type (such as `*float64`)." }
templateLines = """
x := 42
int_ptr := &x
float_ptr := ([1])(
  [2](int_ptr),
)
"""
pool = [ "*float64", "&float64", "float64", "unsafe.Pointer", "itof64" ]
correctAnswers = [ "*float64", "unsafe.Pointer" ]
