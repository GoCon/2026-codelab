why = { ja = "型の位置では `<-chan int`、値を読む式の位置では `<-ch` を使います。", en = "Use `<-chan int` for the type declaration, and `<-ch` as the expression to receive the value." }
takeaway = { ja = "`<-chan` は型、`<-ch` は受信式です。", en = "`<-chan` is the type, whereas `<-ch` is the receive expression." }
templateLines = """
