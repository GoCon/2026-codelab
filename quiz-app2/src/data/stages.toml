[[campaignTiers.stages]]
id = "select-struct-plusv"
kind = "fill"
label = { ja = "fmt", en = "fmt" }
title = { ja = "構造体の field 名", en = "Struct Field Names" }
prompt = { ja = "{Name:Gopher Age:10} を field 名つきで表示する 2 か所。", en = "Fill in the 2 blanks to output {Name:Gopher Age:10} with its field names." }
outputLines = """
{Name:Gopher Age:10}
"""
playgroundUrl = "https://go.dev/play/p/bUZNxIr7BYy"
why = { ja = "`fmt.Printf` と `%+v` を組み合わせると、struct の field 名も含めて表示できます。", en = "Combining `fmt.Printf` with `%+v` allows you to print a struct including its field names." }
takeaway = { ja = "`fmt.Print` や `fmt.Println` ではなく、`fmt.Printf(\"%+v\", gopher)` を使うと field 名つきで表示できます。", en = "Instead of `fmt.Print` or `fmt.Println`, use `fmt.Printf(\"%+v\", gopher)` to print structs with field names." }
templateLines = """
gopher := Gopher{Name: "Gopher", Age: 10}
[1]([2], gopher)
"""
pool = [ "fmt.Printf", "fmt.Print", "fmt.Println", "\"%v\"", "\"%T\"", "\"%+v\"" ]
correctAnswers = [ "fmt.Printf", "\"%+v\"" ]

[[campaignTiers.stages]]
id = "fill-fmt-hex-output"
kind = "fill"
label = { ja = "fmt", en = "fmt" }
title = { ja = "10進と16進", en = "Decimal and Hexadecimal" }
prompt = { ja = "Value: 255, Hex: ff を出す 2 か所。", en = "Fill in the 2 blanks to output Value: 255, Hex: ff." }
outputLines = """
Value: 255, Hex: ff
"""
playgroundUrl = "https://go.dev/play/p/gKHeYb66kh3"
why = { ja = "`%d` は 10 進、`%x` は小文字の 16 進です。", en = "`%d` is for base 10 (decimal), and `%x` is for lowercase base 16 (hexadecimal)." }
takeaway = { ja = "同じ数値でも verb を変えるだけで表示形式を切り替えられます。", en = "You can change the display format of the exact same number just by changing the verb." }
templateLines = """
num := 255
fmt.Printf(
  "Value: [1], Hex: [2]",
  num,
  num,
)
"""
pool = [ "%d", "%b", "%o", "%x", "%X" ]
correctAnswers = [ "%d", "%x" ]

[[campaignTiers.stages]]
id = "fill-fmt-indexed-order"
kind = "fill"
label = { ja = "fmt", en = "fmt" }
title = { ja = "引数番号で並べ替え", en = "Reorder by Argument Index" }
prompt = { ja = "Age: 20, Name: Alice を出す 2 か所。", en = "Fill in the 2 blanks to output Age: 20, Name: Alice." }
outputLines = """
Age: 20, Name: Alice
"""
playgroundUrl = "https://go.dev/play/p/qL2BSv7XrwK"
why = { ja = "`%[n]` を使うと、引数の順番を変えずに参照先だけを入れ替えられます。", en = "By using `%[n]`, you can reference a specific argument index without changing the order of the provided arguments." }
takeaway = { ja = "`%[2]d` は 2 番目の引数、`%[1]s` は 1 番目の引数を使う指定です。", en = "`%[2]d` specifies the 2nd argument, and `%[1]s` specifies the 1st argument." }
templateLines = """
name := "Alice"
age := 20
fmt.Printf(
  "Age: [1], Name: [2]",
  name,
  age,
)
"""
pool = [ "%s", "%d", "%[1]s", "%[2]d", "%[1]d", "%[2]s" ]
correctAnswers = [ "%[2]d", "%[1]s" ]

[[campaignTiers.stages]]
id = "fill-fmt-pi-report"
kind = "fill"
label = { ja = "fmt", en = "fmt" }
title = { ja = "fmt.Printf", en = "fmt.Printf" }
prompt = { ja = "Name: \"pi\", Value: 3.14, Type: float64 を出す 3 か所。", en = "Fill in the 3 blanks to output Name: \"pi\", Value: 3.14, Type: float64." }
outputLines = """
Name: "pi", Value: 3.14, Type: float64
"""
playgroundUrl = "https://go.dev/play/p/ZtSoKQnvkam"
why = { ja = "`%q` は引用符つき文字列、`%.2f` は小数第 2 位まで、`%T` は値の型名を出します。", en = "`%q` prints a double-quoted string, `%.2f` rounds to 2 decimal places, and `%T` prints the type name." }
takeaway = { ja = "`%q` / `%.2f` / `%T` を使い分けると、文字列・丸めた小数・型名を一度に確認できます。", en = "By utilizing `%q`, `%.2f`, and `%T`, you can check the string, rounded decimal, and type name all at once." }
templateLines = """
pi := 3.14159
name := "pi"
fmt.Printf(
  "Name: [1], ",
  "Value: [2], ",
  "Type: [3]",
  name,
  pi,
  pi,
)
"""
pool = [ "%s", "%q", "%.2f", "%2f", "%f", "%v", "%T", "%t" ]
correctAnswers = [ "%q", "%.2f", "%T" ]

[[campaignTiers.stages]]
id = "fill-defer-output-order"
kind = "fill"
label = { ja = "defer", en = "defer" }
title = { ja = "defer の実行順序", en = "Execution Order of defer" }
prompt = { ja = "コードの実行結果（出力）の順番を上から完成させてください。", en = "Complete the output order from top to bottom based on the execution result." }
outputLines = """
"""
playgroundUrl = "https://go.dev/play/p/p9uTA5pzU1G"
why = { ja = "`defer` に登録された関数は、関数が終了する際に「最後に追加されたものから順に（LIFO: Last-In, First-Out）」逆順で実行されます。", en = "Functions registered with `defer` are executed in reverse order (LIFO: Last-In, First-Out) just before the surrounding function returns." }
takeaway = { ja = "通常の文（C）が先に実行され、その後に `defer` が下から上の順（B -> A）で実行されるため、出力は C、B、A の順になります。", en = "The normal statement (C) executes first, followed by the deferred statements from bottom to top (B -> A), resulting in C, B, A." }
templateLines = """
// ── 実行されるコード ──
defer fmt.Println("A")
defer fmt.Println("B")
fmt.Println("C")

// ── 出力結果 ──
[1]
[2]
[3]
"""
pool = [ "A", "B", "C" ]
correctAnswers = [ "C", "B", "A" ]

