why = { ja = "複数戻り値は左辺を並べ、初回代入なら `:=` を使います。", en = "For multiple return values, list the variables on the left side and use `:=` for the initial assignment." }
takeaway = { ja = "Go は複数の戻り値を返すことが出来ます。 err を最後に返すのが一般的です。", en = "Go functions can return multiple values. It is standard practice to return the error as the last value." }
