  # tesso57 Q3
  - id: "tesso57_q3"
    title: "nil map の読み書き非対称"
    title_en: Asymmetry of reading and writing a nil map
    mode: "both"
    text: "このコードの挙動はどれ？"
    text_en: What does this code do?
    question_code_ref: "code/tesso57_q3_question.go"
    choices:
      - "0 を出力した後、正常終了"
      - "0 を出力した後、panic"
      - "1行目の fmt.Println の時点で panic"
      - "コンパイルエラー"
    choices_en:
      - Prints 0 and exits normally
      - Prints 0 and then panics
      - Panics at the first `fmt.Println`
      - Compilation error
    answer: 1
    explanation: |
      nil map は読み取り時にゼロ値を返しますが、書き込み時には panic します。
      var m map[string]int は nil で初期化され、m["hello"] の読み取りは int のゼロ値 0 を返します。
      しかし m["hello"] = 1 の書き込みで panic: assignment to entry in nil map が発生します。
      make(map[string]int) で初期化することで回避できます。
    explanation_en: |-
      A nil map returns the zero value when you read from it, but panics when you write to it.
      `var m map[string]int` initializes `m` to nil, so reading `m["hello"]` returns the zero value `0`.
      However, writing `m["hello"] = 1` panics with `assignment to entry in nil map`.
      You can avoid this by initializing it with `make(map[string]int)`.
    answer_code_ref: "code/tesso57_q3_answer.go"
    answer_code_play_ref: "https://go.dev/play/p/xL4MGI0wqHP"

  # tesso57 Q4
  - id: "tesso57_q4"
    title: "map のキーにできる型"
    title_en: Types that can be map keys
    mode: "both"
    text: "Go の map のキーとして使えない型はどれ？"
    text_en: Which type cannot be used as a key in a Go map?
    choices:
      - "string"
      - "int"
      - "[2]int"
      - "[]int"
    choices_en:
      - string
      - int
      - '[2]int'
      - '[]int'
    answer: 3
    explanation: |
      map のキーには == と != で比較できる comparable な型だけが使えます。
      string、int、配列は比較可能ですが、slice は比較できないため map のキーにできません。
      同じ理由で map や関数もキーにできません。
    explanation_en: |-
      Only comparable types, which can be compared with `==` and `!=`, can be used as map keys.
      `string`, `int`, and arrays are comparable, but slices are not, so slices cannot be map keys.
      For the same reason, maps and functions also cannot be map keys.
    answer_code_ref: "code/tesso57_q4_answer.go"
    answer_code_play_ref: "https://go.dev/play/p/s0DAFLy5Ebh"

  # tesso57 Q5
  - id: "tesso57_q5"
    title: "map 要素は直接更新できない"
    title_en: Map elements cannot be updated directly
    mode: "both"
    text: "このコードの挙動はどれ？"
    text_en: What does this code do?
    question_code_ref: "code/tesso57_q5_question.go"
    choices:
      - "11 に更新される"
      - "新しい要素が追加される"
      - "panic が発生する"
      - "コンパイルエラー"
    choices_en:
      - It updates the value to 11
      - It adds a new element
      - It panics
      - Compilation error
    answer: 3
    explanation: |
      map の要素はアドレス可能ではないため、m["gopher"].Age = 11 のように構造体フィールドを直接更新できません。
      map の再配置で要素のアドレスが変わりうるためです。
      一度ローカル変数に取り出して更新し、m["gopher"] = u のように代入し直す必要があります。
      あるいは map[string]*User のようにポインタを持たせる設計にする方法もあります。
    explanation_en: |-
      Map elements are not addressable, so you cannot update a struct field directly like `m["gopher"].Age = 11`.
      This is because the address of a map element can change when the map is resized.
      You must first copy the value into a local variable, update it, and assign it back with `m["gopher"] = u`.
      Another option is to use a design like `map[string]*User` and store pointers.
    answer_code_ref: "code/tesso57_q5_answer.go"
    answer_code_play_ref: "https://go.dev/play/p/ESlQsu20rXB"
