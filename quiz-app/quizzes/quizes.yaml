  - id: "hasegawa_itsuki_q3"
    title: "ポインタ渡しの更新"
    title_en: Updating through a pointer
    mode: "both"
    text: "以下の A〜D のうち、関数を呼んだ後に msg の値が \"Original\" から\"Changed\" に変わるのはどれ？"
    text_en: Among A-D below, which call changes `msg` from "Original" to 
      "Changed" after the function returns?
    question_code_ref: "code/hasegawa_itsuki_q3_question.go"
    choices:
      - "A. updateA(msg)"
      - "B. updateB(&msg)"
      - "C. updateC(&msg)"
      - "D. updateD(&ptr)"
    choices_en:
      - A. updateA(msg)
      - B. updateB(&msg)
      - C. updateC(&msg)
      - D. updateD(&ptr)
    answer: 2
    explanation: "A は値渡しなので msg は変わりません。B は *string のコピーを差し替えるだけで msg に影響しません。C は
      *s = \"Changed\" でポインタの指す先を直接書き換えるため msg が Changed になります。D は ptr の向き先を変えるだけで
      msg は不変です。"

    explanation_en: A passes by value, so `msg` does not change. B only 
      reassigns a copied `*string`, so it does not affect `msg`. C writes 
      directly to the value pointed to by `s` with `*s = "Changed"`, so `msg` 
      becomes `Changed`. D only changes what `ptr` points to, so `msg` stays the
      same.
