# sivchari Q1
- id: "sivchari_q1"
  title: "配列リテラルのインデックス指定"
  mode: "both"
  text: "このコードの出力は何？"
  question_code_ref: "code/sivchari_q1_question.go"
  choices:
    - "5 [0 1 0 3 4]"
    - "4 [0 3 4 1]"
    - "6 [0 1 0 3 4 0]"
    - "コンパイルエラー"
  answer: 0
  explanation: |
    Go の配列リテラルでは、要素にインデックスを指定して初期化できます。
    インデックス指定がない要素は、直前のインデックス + 1 の位置に配置されます。

    この問題では:
    - 0 → index 0
    - 3:3 → index 3
    - 4 → index 4 (直前の index 3 + 1)
    - 1:1 → index 1

    [...]T{} の長さは仕様で "The notation ... specifies an array length equal to the maximum element index plus one." と定められているため、max index 4 + 1 = 5 になります。
    明示的に指定されなかった index 2 にはゼロ値が入ります。

    公式仕様 (Array types): https://go.dev/ref/spec#Array_types
    公式仕様 (Composite literals): https://go.dev/ref/spec#Composite_literals
  answer_code_ref: "code/sivchari_q1_answer.go"

# sivchari Q2
- id: "sivchari_q2"
  title: "iota の継続と式の引き継ぎ"
  mode: "both"
  text: "このコードの出力は何？"
  question_code_ref: "code/sivchari_q2_question.go"
  choices:
    - "0 2 0 1"
    - "0 2 2 3"
    - "0 2 0 3"
    - "コンパイルエラー"
  answer: 1
  explanation: |
    iota は const ブロック内で 0 から始まり、各行ごとに 1 ずつ増加します。
    途中で `c = iota` と書き直しても iota はリセットされず、その行の位置 (2) がそのまま値になります。

    - a = iota * 2: iota=0 → 0
    - b: 式 iota*2 を引き継ぐ → iota=1 → 2
    - c = iota: 新しい式。iota=2 → 2
    - d: 式 iota を引き継ぐ → iota=3 → 3

    b と c が同じ値 2 になるのがポイントです。
    iota がリセットされるのは新しい const ブロックが始まったときだけです。

    公式仕様 (Iota): https://go.dev/ref/spec#Iota
  answer_code_ref: "code/sivchari_q2_answer.go"

