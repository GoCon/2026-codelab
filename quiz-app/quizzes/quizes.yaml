  # sivchari Q1
  - id: "sivchari_q1"
    title: "配列リテラルのインデックス指定"
    title_en: Indexed elements in array literals
    mode: "both"
    text: "このコードの出力は何？"
    text_en: What does this code print?
    question_code_ref: "code/sivchari_q1_question.go"
    choices:
      - "5 [0 1 0 3 4]"
      - "4 [0 3 4 1]"
      - "6 [0 1 0 3 4 0]"
      - "コンパイルエラー"
    choices_en:
      - 5 [0 1 0 3 4]
      - 4 [0 3 4 1]
      - 6 [0 1 0 3 4 0]
      - Compilation error
    answer: 0
    explanation: |
      Go の配列リテラルでは、要素にインデックスを指定して初期化できます。
      インデックス指定がない要素は、直前のインデックス + 1 の位置に配置されます。

      この問題では:
      - 0 → index 0
      - 3:3 → index 3
      - 4 → index 4 (直前の index 3 + 1)
      - 1:1 → index 1

      [...]T{} の長さは仕様で "The notation ... specifies an array length equal to the maximum element index plus one." と定められているため、max index 4 + 1 = 5 になります。
      明示的に指定されなかった index 2 にはゼロ値が入ります。

      公式仕様 (Array types): https://go.dev/ref/spec#Array_types
      公式仕様 (Composite literals): https://go.dev/ref/spec#Composite_literals
    explanation_en: |-
      In a Go array literal, you can initialize elements with explicit indexes.
      Elements without an explicit index are placed at the previous index + 1.

      In this quiz:
      - 0 -> index 0
      - 3:3 -> index 3
      - 4 -> index 4 (previous index 3 + 1)
      - 1:1 -> index 1

      The spec says, "The notation ... specifies an array length equal to the maximum element index plus one.",
      so the length is max index 4 + 1 = 5.
      Index 2, which is not specified explicitly, gets the zero value.

      Go spec (Array types): https://go.dev/ref/spec#Array_types
      Go spec (Composite literals): https://go.dev/ref/spec#Composite_literals
    answer_code_ref: "code/sivchari_q1_answer.go"

  # sivchari Q2
  - id: "sivchari_q2"
    title: "iota の継続と式の引き継ぎ"
    title_en: How iota continues across lines
    mode: "both"
    text: "このコードの出力は何？"
    text_en: What does this code print?
    question_code_ref: "code/sivchari_q2_question.go"
    choices:
      - "0 2 0 1"
      - "0 2 2 3"
      - "0 2 0 3"
      - "コンパイルエラー"
    choices_en:
      - 0 2 0 1
      - 0 2 2 3
      - 0 2 0 3
      - Compilation error
    answer: 1
    explanation: |
      iota は const ブロック内で 0 から始まり、各行ごとに 1 ずつ増加します。
      途中で `c = iota` と書き直しても iota はリセットされず、その行の位置 (2) がそのまま値になります。

      - a = iota * 2: iota=0 → 0
      - b: 式 iota*2 を引き継ぐ → iota=1 → 2
      - c = iota: 新しい式。iota=2 → 2
      - d: 式 iota を引き継ぐ → iota=3 → 3

      b と c が同じ値 2 になるのがポイントです。
      iota がリセットされるのは新しい const ブロックが始まったときだけです。

      公式仕様 (Iota): https://go.dev/ref/spec#Iota
    explanation_en: |-
      `iota` starts at 0 inside a const block and increases by 1 on each line.
      Even if you rewrite a line as `c = iota`, `iota` is not reset; it simply becomes the line index, 2.

      - a = iota * 2: iota=0 -> 0
      - b: inherits the expression iota*2 -> iota=1 -> 2
      - c = iota: a new expression. iota=2 -> 2
      - d: inherits the expression iota -> iota=3 -> 3

      The key point is that `b` and `c` both become 2.
      `iota` is reset only when a new const block begins.

      Go spec (Iota): https://go.dev/ref/spec#Iota
    answer_code_ref: "code/sivchari_q2_answer.go"

  # tomtwinkle Q1
  - id: "tomtwinkle_q1"
    title: "go test キャッシュ"
    title_en: go test cache
    mode: "both"
    text: |
      go test は、同じコードに対して2回目を実行すると「(cached)」と表示され一瞬で終わります。
      このキャッシュを無視して強制的に再テストするフラグはどれ？
    text_en: |-
      When you run `go test` twice against the same code, the second run may finish instantly with `(cached)`.
      Which flag forces the tests to run again instead of using the cache?
    choices:
      - "go test -nocache"
      - "go test -force"
      - "go test -count=1"
      - "go test -clear"
    choices_en:
      - go test -nocache
      - go test -force
      - go test -count=1
      - go test -clear
    answer: 2
    explanation: |
      キャッシュを無効化する専用のフラグはなく、「このテストを1回実行する」という意味の -count=1 を指定するのが、キャッシュ回避の公式イディオムです。
      go clean -testcache でキャッシュ全消去も可能です。

      公式ドキュメント: https://pkg.go.dev/cmd/go#hdr-Testing_flags
    explanation_en: |-
      There is no dedicated flag to disable the cache.
      The official idiom is to pass `-count=1`, which means "run this test once" and bypasses the cache.
      You can also clear the entire test cache with `go clean -testcache`.

      Official docs: https://pkg.go.dev/cmd/go#hdr-Testing_flags
    answer_code_ref: "code/tomtwinkle_q1_answer.go"
    answer_code_play_ref: "https://go.dev/play/p/q3esYHlP6lG"

  # tomtwinkle Q2
  - id: "tomtwinkle_q2"
    title: "型無し定数の精度"
    title_en: Precision of untyped constants
    mode: "both"
    text: |
      変数を使わず、定数で64ビットの限界を超える巨大な数値を定義するとどうなる？
    text_en: What happens if you define a huge constant, without using a 
      variable, that exceeds the 64-bit limit?
    question_code_ref: "code/tomtwinkle_q2_question.go"
    choices:
      - "オーバーフローでコンパイルエラー"
      - "0 になる"
      - "負の最大値にラップアラウンドする"
      - "コンパイルは通る"
    choices_en:
      - Compilation error because of overflow
      - Becomes 0
      - Wraps around to the largest negative value
      - Still compiles
    answer: 3
    explanation: |
      Goの「型無し定数」は、コンパイル時には少なくとも256ビットの精度を持ちます。
      変数に代入する段階になって初めて型の限界値のチェックが行われるため、定数同士の計算中であればオーバーフローしません。

      公式仕様: https://go.dev/ref/spec#Constants
      Go Blog: https://go.dev/blog/constants
    explanation_en: |-
      Go's untyped constants keep at least 256 bits of precision during compilation.
      Overflow is checked only when the value is assigned to a typed variable,
      so calculations on constants alone do not overflow.

      Go spec: https://go.dev/ref/spec#Constants
      Go Blog: https://go.dev/blog/constants
    answer_code_ref: "code/tomtwinkle_q2_answer.go"
    answer_code_play_ref: "https://go.dev/play/p/vb4924cUKsl"

  # tomtwinkle Q4
  - id: "tomtwinkle_q4"
    title: "defer in loop"
    title_en: defer inside a loop
    mode: "both"
    text: |
      以下のコードの問題点は？
    text_en: What is the problem with this code?
    question_code_ref: "code/tomtwinkle_q4_question.go"
    choices:
      - "ループごとにファイルが上書きされる"
      - "ファイルディスクリプタが枯渇する"
      - "os.Open は defer で閉じることができない"
      - "コンパイルエラーになる"
    choices_en:
      - The file is overwritten on each loop iteration
      - File descriptors are exhausted
      - '`os.Open` cannot be closed with defer'
      - It fails to compile
    answer: 1
    explanation: |
      defer のスコープは「ブロック」ではなく「関数」です。
      ループの中で defer を大量に呼ぶと、関数が終わるまで一切クローズされず、OSのリソース制限に引っかかってパニックになることがあります。
      解決策はループ本体を別関数に切り出すことです。

      Go Blog (defer の仕様): https://go.dev/blog/defer-panic-and-recover
      公式仕様: https://go.dev/ref/spec#Defer_statements
    explanation_en: |-
      The scope of `defer` is the function, not the block.
      If you call `defer` many times inside a loop, nothing is closed until the function returns,
      so you can hit the OS resource limit and panic.
      The fix is to move the loop body into a separate function.

      Go Blog (how defer works): https://go.dev/blog/defer-panic-and-recover
      Go spec: https://go.dev/ref/spec#Defer_statements
    answer_code_ref: "code/tomtwinkle_q4_answer.go"
    answer_code_play_ref: "https://go.dev/play/p/hM0PTI0iko7"

  # tomtwinkle Q5
  - id: "tomtwinkle_q5"
    title: "clear() on slice"
    title_en: clear() on a slice
    mode: "both"
    text: |
      以下のコードの実行結果は？
    text_en: What is the result of running this code?
    question_code_ref: "code/tomtwinkle_q5_question.go"
    choices:
      - "0"
      - "3"
      - "nil"
      - "コンパイルエラー"
    choices_en:
      - '0'
      - '3'
      - nil
      - Compilation error
    answer: 1
    explanation: |
      Go 1.21 で追加された組み込み関数 clear()。
      マップに使うと要素を空（len=0）にしますが、スライスに使うと長さ（len）と容量（cap）はそのままに、全要素を「ゼロ値」に上書きします。
      要素自体が消えるわけではありません。

      公式仕様 (clear): https://go.dev/ref/spec#Clear
      pkg.go.dev: https://pkg.go.dev/builtin#clear
    explanation_en: |-
      `clear()` was added in Go 1.21.
      When you use it on a map, it removes all elements (`len=0`).
      When you use it on a slice, it keeps the same length and capacity and simply overwrites every element with the zero value.
      The elements themselves are not removed.

      Go spec (`clear`): https://go.dev/ref/spec#Clear
      pkg.go.dev: https://pkg.go.dev/builtin#clear
    answer_code_ref: "code/tomtwinkle_q5_answer.go"
    answer_code_play_ref: "https://go.dev/play/p/NkAkv-tUNKr"

  # tomtwinkle Q6
  - id: "tomtwinkle_q6"
    title: "named return + defer"
    title_en: Named returns and defer
    mode: "both"
    text: |
      以下の関数を呼び出したとき、呼び出し元が受け取る値は？
    text_en: When this function is called, what value does the caller receive?
    question_code_ref: "code/tomtwinkle_q6_question.go"
    choices:
      - "0"
      - "1"
      - "2"
      - "コンパイルエラー"
    choices_en:
      - '0'
      - '1'
      - '2'
      - Compilation error
    answer: 2
    explanation: |
      名前付き戻り値の罠です。
      return 1 が実行されると、まず変数 n に 1 が代入され、その後に defer が実行されて n が 2 になり、それが返されます。
      実行順序: return 1 → n=1 代入 → defer で n++ → n=2 が返る

      Go Blog (defer の仕様): https://go.dev/blog/defer-panic-and-recover
      公式仕様: https://go.dev/ref/spec#Return_statements
    explanation_en: |-
      This is the classic named return trap.
      When `return 1` runs, Go first assigns 1 to the named return variable `n`,
      then the deferred function runs and changes `n` to 2, and that value is returned.
      Execution order: `return 1` -> assign n=1 -> `defer` runs and increments n -> n=2 is returned

      Go Blog (how defer works): https://go.dev/blog/defer-panic-and-recover
      Go spec: https://go.dev/ref/spec#Return_statements
    answer_code_ref: "code/tomtwinkle_q6_answer.go"
    answer_code_play_ref: "https://go.dev/play/p/973xesVL17U"

  # tomtwinkle Q7
  - id: "tomtwinkle_q7"
    title: "range over string"
    title_en: range over a string
    mode: "both"
    text: |
      以下のコードの出力はどれ？
    text_en: Which output does this code produce?
    question_code_ref: "code/tomtwinkle_q7_question.go"
    choices:
      - |-
        i=0 v=日
        i=1 v=本
        i=2 v=語
      - |-
        i=0 v=26085
        i=3 v=26412
        i=6 v=35486
      - |-
        i=0 v=230
        i=1 v=151
        i=2 v=165
        i=3 v=230
        i=4 v=156
        i=5 v=172
        i=6 v=232
        i=7 v=170
        i=8 v=158
      - "コンパイルエラー"
    choices_en:
      - |-
        i=0 v=日
        i=1 v=本
        i=2 v=語
      - |-
        i=0 v=26085
        i=3 v=26412
        i=6 v=35486
      - |-
        i=0 v=230
        i=1 v=151
        i=2 v=165
        i=3 v=230
        i=4 v=156
        i=5 v=172
        i=6 v=232
        i=7 v=170
        i=8 v=158
      - Compilation error
    answer: 1
    explanation: |
      Go の string range は UTF-8 デコードを行い、インデックスはバイト位置、値は rune（Unicode コードポイント）です。
      「日」(U+65E5=26085) は index=0、「本」(U+672C=26412) は index=3、「語」(U+8A9E=35486) は index=6 から始まります。
      各漢字は UTF-8 で 3 バイトです。

      Go Blog (文字列と rune): https://go.dev/blog/strings
      公式仕様 (range): https://go.dev/ref/spec#For_range
    explanation_en: |-
      Ranging over a Go string decodes UTF-8.
      The index is the byte position, and the value is a rune (Unicode code point).
      `日` (U+65E5 = 26085) starts at index 0, `本` (U+672C = 26412) at index 3, and `語` (U+8A9E = 35486) at index 6.
      Each kanji uses 3 bytes in UTF-8.

      Go Blog (strings and runes): https://go.dev/blog/strings
      Go spec (`range`): https://go.dev/ref/spec#For_range
    answer_code_ref: "code/tomtwinkle_q7_answer.go"
    answer_code_play_ref: "https://go.dev/play/p/BVyqOwrA1tg"

  # tomtwinkle Q8
  - id: "tomtwinkle_q8"
    title: "t.Fatal in goroutine"
    title_en: t.Fatal inside a goroutine
    mode: "both"
    text: |
      テスト goroutine ではない「別途起動した goroutine」の中で t.Fatal() を呼ぶとどうなる？
    text_en: What happens if you call `t.Fatal()` inside a goroutine that is not
      the test goroutine itself?
    question_code_ref: "code/tomtwinkle_q8_question.go"
    choices:
      - "テストが正しく終了し、失敗としてマークされる"
      - "テストがタイムアウトするまで止まらなくなる"
      - "panic になりプロセスがクラッシュする"
      - "何も起こらずテストは成功扱いになる"
    choices_en:
      - The test ends correctly and is marked failed
      - The test keeps running until it times out
      - It panics and crashes the process
      - Nothing happens and the test is reported as success
    answer: 1
    explanation: |
      t.Fatal は runtime.Goexit() を呼ぶため、別 goroutine で呼ぶとその goroutine だけが静かに終了し、テスト自体は止まりません。
      Go 1.24 からは go vet で検出されるようになりました。
      正しいアプローチ: goroutine 内では t.Error を使い channel で完了を通知するか、errgroup などを活用します。

      pkg.go.dev (testing.T.Fatal): https://pkg.go.dev/testing#T.Fatal
      Go 1.24 リリースノート: https://go.dev/doc/go1.24
    explanation_en: |-
      `t.Fatal` calls `runtime.Goexit()`.
      If you call it in another goroutine, only that goroutine exits quietly, and the test itself keeps running.
      Since Go 1.24, `go vet` can detect this.
      Correct approaches include using `t.Error` inside the goroutine and signaling completion through a channel, or using `errgroup`.

      pkg.go.dev (`testing.T.Fatal`): https://pkg.go.dev/testing#T.Fatal
      Go 1.24 release notes: https://go.dev/doc/go1.24
    answer_code_ref: "code/tomtwinkle_q8_answer.go"
    answer_code_play_ref: "https://go.dev/play/p/uP543Km7JNK"

  # tomtwinkle Q9
  - id: "tomtwinkle_q9"
    title: "GOMAXPROCS in containers"
    title_en: GOMAXPROCS in containers
    mode: "both"
    text: |
      Docker や Kubernetes 上で Go アプリを動かす際、CPU のコア数を認識させて GOMAXPROCS を最適化するために、
      最新の Go バージョンにおいて推奨されるコードはどれ？
    text_en: |-
      When running a Go application on Docker or Kubernetes,
      which code is recommended in modern Go to let GOMAXPROCS respect CPU limits?
    choices:
      - 'import _ "go.uber.org/automaxprocs" を入れる'
      - "環境変数 GOMAXPROCS をシェルで計算して渡す"
      - "runtime.GOMAXPROCS(runtime.NumCPU()) を呼ぶ"
      - "何もしなくてよい"
    choices_en:
      - Add `import _ "go.uber.org/automaxprocs"`
      - Compute `GOMAXPROCS` in the shell and pass it as an environment variable
      - Call `runtime.GOMAXPROCS(runtime.NumCPU())`
      - Do nothing
    answer: 3
    explanation: |
      長年 Uber の automaxprocs を入れるのが Kubernetes 時代の定石でしたが、
      Go 1.25 からランタイムがコンテナの CPU 制限（cgroup CPU quota）を自動検知するようになったため、完全に不要になりました。

      Go 1.25 リリースノート: https://go.dev/doc/go1.25
      pkg.go.dev (runtime.GOMAXPROCS): https://pkg.go.dev/runtime#GOMAXPROCS
    explanation_en: |-
      For a long time, adding Uber's `automaxprocs` was the common approach in Kubernetes.
      But since Go 1.25, the runtime automatically detects container CPU limits (cgroup CPU quota),
      so you no longer need it.

      Go 1.25 release notes: https://go.dev/doc/go1.25
      pkg.go.dev (`runtime.GOMAXPROCS`): https://pkg.go.dev/runtime#GOMAXPROCS
    answer_code_ref: "code/tomtwinkle_q9_answer.go"
    answer_code_play_ref: "https://go.dev/play/p/3Az4nyarOeI"

  # tomtwinkle Q10
  - id: "tomtwinkle_q10"
    title: "synctest isolation"
    title_en: synctest isolation
    mode: "both"
    text: |
      synctest.Run ブロックの「外側」で起動した goroutine と、「内側」で起動した goroutine 同士が
      channel で同期通信しようとするとどうなる？
    text_en: |-
      What happens if a goroutine started outside a `synctest.Run` block and a goroutine started inside it
      try to synchronize over a channel?
    question_code_ref: "code/tomtwinkle_q10_question.go"
    choices:
      - "正常に通信できる"
      - "外側の goroutine が強制終了させられる"
      - "deadlock を検知して panic する"
      - "常に非同期通信（buffered channel）に変換される"
    choices_en:
      - They communicate normally
      - The outer goroutine is forcefully terminated
      - It detects a deadlock and panics
      - It is always converted to asynchronous communication (a buffered 
        channel)
    answer: 2
    explanation: |
      synctest は独自の仮想時計とスケジューラ内で隔離されて動くため、リアルタイムで動く通常の goroutine や本物のネットワーク I/O と直接的な同期通信を行おうとすると、テストの決定性が壊れるためエラーとなります。

      pkg.go.dev (testing/synctest): https://pkg.go.dev/testing/synctest
      Go Blog (synctest): https://go.dev/blog/synctest
      Go 1.24 リリースノート: https://go.dev/doc/go1.24

    explanation_en: |-
      `synctest` runs inside its own isolated virtual clock and scheduler.
      If it tries to synchronize directly with ordinary goroutines running in real time, or with real network I/O,
      the test would lose determinism, so Go reports it as an error.

      pkg.go.dev (`testing/synctest`): https://pkg.go.dev/testing/synctest
      Go Blog (`synctest`): https://go.dev/blog/synctest
      Go 1.24 release notes: https://go.dev/doc/go1.24
  # tomtwinkle Q11
  - id: "tomtwinkle_q11"
    title: "Go keyword"
    title_en: Go keyword
    mode: "both"
    text: |
      この中から Go の keyword を選択してください。
    text_en: Which of these is a Go keyword?
    choices:
      - "new"
      - "goto"
      - "nil"
      - "error"
    choices_en:
      - new
      - goto
      - nil
      - error
    answer: 1
    explanation: |
      goto だけが Go の keyword です。
      new は組み込み関数、nil は事前宣言済み識別子、error は事前宣言済みのインターフェース型で、いずれも keyword ではありません。

      公式仕様 (Keywords): https://go.dev/ref/spec#Keywords
      公式仕様 (Predeclared identifiers): https://go.dev/ref/spec#Predeclared_identifiers

    explanation_en: |-
      Only `goto` is a Go keyword.
      `new` is a built-in function, `nil` is a predeclared identifier, and `error` is a predeclared interface type.
      None of those are keywords.

      Go spec (Keywords): https://go.dev/ref/spec#Keywords
      Go spec (Predeclared identifiers): https://go.dev/ref/spec#Predeclared_identifiers
  # tomtwinkle Q12
  - id: "tomtwinkle_q12"
    title: "time.Format layout"
    title_en: time.Format layout
    mode: "both"
    text: |
      Go の time.Format で時刻レイアウトを指定する方法として正しいのはどれ？
    text_en: Which one is the correct way to specify a time layout in Go's 
      `time.Format`?
    choices:
      - "1970-01-02"
      - "0001-02-03"
      - "2006-01-02"
      - "1999-12-31"
    choices_en:
      - '1970-01-02'
      - '0001-02-03'
      - '2006-01-02'
      - '1999-12-31'
    answer: 2
    explanation: |
      Go の time.Format / time.Parse は、独自のフォーマット記号ではなく基準時刻
      "Mon Jan 2 15:04:05 MST 2006" を並べたレイアウト文字列で指定します。
      たとえば "2006-01-02" は年-月-日、"15:04:05" は時:分:秒を表します。

      pkg.go.dev (time): https://pkg.go.dev/time

    explanation_en: |-
      `time.Format` and `time.Parse` use a layout string built from the reference time
      `Mon Jan 2 15:04:05 MST 2006`, not symbolic format tokens.
      For example, `2006-01-02` means year-month-day, and `15:04:05` means hour:minute:second.

      pkg.go.dev (`time`): https://pkg.go.dev/time
  # tomtwinkle Q13
  - id: "tomtwinkle_q13"
    title: "Go founding member"
    title_en: A legendary Go founder
    mode: "both"
    text: |
      Go 言語は Google のエンジニアによって作られましたが、初期メンバーの中には
      IT の歴史を作った「生きる伝説」とも呼べる偉大なプログラマが含まれています。
      それは誰でしょう？
    text_en: |-
      Go was created by Google engineers, but one of the original members was a legendary programmer
      who helped shape computing history. Who was it?
    choices:
      - "Linus Torvalds"
      - "Ken Thompson"
      - "Guido van Rossum"
      - "James Gosling"
    choices_en:
      - Linus Torvalds
      - Ken Thompson
      - Guido van Rossum
      - James Gosling
    answer: 1
    explanation: |
      正解は Ken Thompson です。Go の作者としては Robert Griesemer、Rob Pike、
      Ken Thompson の 3 名が知られています。
      Ken Thompson は Bell Labs で Unix を共同開発したことで特に有名で、
      その流れの中で C 言語のもとになった B 言語の設計や Plan 9 の開発にも関わった、
      計算機史に残るプログラマです。
      システムソフトウェアの設計に深く関わってきた人物が、Go の初期設計メンバーにも入っています。

      Go FAQ: https://go.dev/doc/faq#history

    explanation_en: |-
      The correct answer is Ken Thompson.
      The three Go creators usually cited are Robert Griesemer, Rob Pike, and Ken Thompson.
      Ken Thompson is especially famous for co-creating Unix at Bell Labs, and he also worked on the B language that led to C and on Plan 9.
      A programmer with deep roots in system software design was part of Go's original design team.

      Go FAQ: https://go.dev/doc/faq#history
  # tomtwinkle Q14
  - id: "tomtwinkle_q14"
    title: "goroutine initial stack"
    title_en: Initial goroutine stack size
    mode: "both"
    text: |
      ゴルーチンは 1 つ起動するのに、初期状態でどれくらいのメモリを消費すると考えるのが近いでしょうか？
    text_en: Roughly how much memory does a newly started goroutine use at 
      first?
    choices:
      - "数 KB 程度（約 2KB）"
      - "約 64KB"
      - "約 1MB"
      - "OS スレッドと同じ数 MB"
    choices_en:
      - A few KB (about 2 KB)
      - About 64 KB
      - About 1 MB
      - Several MB, like an OS thread
    answer: 0
    explanation: |
      goroutine は軽量で、初期スタックはごく小さく、現行ランタイムでは約 2KB から始まります。
      必要に応じてスタックが伸縮するため、大量の goroutine を比較的低コストで扱えます。

      Go FAQ (Goroutines): https://go.dev/doc/faq#goroutines

    explanation_en: |-
      Goroutines are lightweight.
      Their initial stack is very small, starting at around 2 KB in the current runtime.
      The stack grows and shrinks as needed, so you can handle many goroutines at relatively low cost.

      Go FAQ (Goroutines): https://go.dev/doc/faq#goroutines
  # tomtwinkle Q15
  - id: "tomtwinkle_q15"
    title: "pointer arithmetic"
    title_en: Pointer arithmetic
    mode: "both"
    text: |
      Go 言語には C 言語でおなじみの「ポインタ」がありますが、
      C 言語では当たり前にできて、Go 言語では安全のために意図的にできなくしているポインタ操作はどれでしょう？
    text_en: |-
      Go has pointers like C, but which pointer operation is intentionally disallowed in Go for safety
      even though it is commonplace in C?
    choices:
      - "ポインタに整数を足し引きして任意のアドレスへ進める"
      - "変数のアドレスを取得する"
      - "ポインタ経由で値を書き換える"
      - "nil と比較する"
    choices_en:
      - Add or subtract integers from a pointer to move to an arbitrary address
      - Take the address of a variable
      - Modify a value through a pointer
      - Compare with nil
    answer: 0
    explanation: |
      Go では安全性を保つため、通常のコードでポインタ演算はできません。
      変数のアドレス取得、参照先の読み書き、nil との比較はできますが、
      C 言語のようなポインタの加減算は `unsafe` を使わない限り行えません。

      Go FAQ (Why is there no pointer arithmetic?): https://go.dev/doc/faq#no_pointer_arithmetic
      pkg.go.dev (unsafe): https://pkg.go.dev/unsafe

    explanation_en: |-
      To preserve safety, Go does not allow pointer arithmetic in ordinary code.
      You can take an address, read and write through a pointer, and compare it with `nil`,
      but you cannot do C-style pointer addition or subtraction unless you step into `unsafe`.

      Go FAQ (Why is there no pointer arithmetic?): https://go.dev/doc/faq#no_pointer_arithmetic
      pkg.go.dev (`unsafe`): https://pkg.go.dev/unsafe
  # tomtwinkle Q16
  - id: "tomtwinkle_q16"
    title: "compiler warnings"
    title_en: Compiler warnings
    mode: "both"
    text: |
      他のコンパイル言語と比較した場合の Go 言語のコンパイラの特徴として正しいのはどれ？
    text_en: Which statement correctly describes the Go compiler compared with 
      many other compiled languages?
    choices:
      - "コンパイラがワーニングを出さない"
      - "fmt.Printf の書式指定ミスのような問題は、コンパイラが error にする"
      - "実行時にだけ型チェックを行う"
      - "コンパイル時に自動でメモリリークを検出する"
    choices_en:
      - The compiler does not emit warnings
      - The compiler turns issues like `fmt.Printf` format mistakes into errors
      - Type checking happens only at runtime
      - It automatically detects memory leaks at compile time
    answer: 0
    explanation: |
      Go のコンパイラは「警告を出して通す」のではなく、問題があればエラーとして止める方針です。
      たとえば未使用の変数や import は warning ではなく compile error になります。
      fmt.Printf の書式指定ミスのような、より高度な静的解析は `go vet` の役割です。

      Go FAQ (Can I stop these complaints about my unused variable/import?): https://go.dev/doc/faq#unused_variables_and_imports
      pkg.go.dev (go vet): https://pkg.go.dev/cmd/vet

    explanation_en: |-
      The Go compiler follows a "no warnings" policy: it stops with errors instead of emitting warnings and continuing.
      For example, unused variables and imports are compile errors, not warnings.
      More advanced static checks, such as `fmt.Printf` format issues, are the job of `go vet`.

      Go FAQ (Can I stop these complaints about my unused variable/import?): https://go.dev/doc/faq#unused_variables_and_imports
      pkg.go.dev (`go vet`): https://pkg.go.dev/cmd/vet
