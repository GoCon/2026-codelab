      - "%s"
    choices_en:
      - '%v'
      - '%+v'
      - '%#v'
      - '%s'
    answer: 2
    explanation: |
      %v は {Gopher 10}、%+v はフィールド名付きの {Name:Gopher Age:10}、
      %#v は Go の構文そのままの main.User{Name:"Gopher", Age:10} を出力します。
      %#v はパッケージ名・型名・フィールド名・値の引用符まで含むので、デバッグ時に型情報まで確認したいときに便利です。
    explanation_en: |-
      `%v` prints `{Gopher 10}`, `%+v` prints `{Name:Gopher Age:10}`,
      and `%#v` prints the Go-syntax form `main.User{Name:"Gopher", Age:10}`.
      `%#v` includes the package name, type name, field names, and even quotes around string values,
