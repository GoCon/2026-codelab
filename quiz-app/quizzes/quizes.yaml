  # tesso57 Q1
  - id: "tesso57_q1"
    title: "Stringer の無限再帰"
    title_en: Infinite recursion in Stringer
    mode: "both"
    text: "このコードの挙動はどれ？"
    text_en: What does this code do?
    question_code_ref: "code/tesso57_q1_question.go"
    choices:
      - "Name: Go"
      - "Name: Name: Go"
      - "スタックオーバーフローで runtime error"
      - "コンパイルエラー"
    choices_en:
      - 'Name: Go'
      - 'Name: Name: Go'
      - Runtime error from stack overflow
      - Compilation error
    answer: 2
    explanation: |
      %v は Stringer interface を実装している型に対して String() を呼びます。
      String() の中で fmt.Sprintf("%v", n) を使うと、再び String() が呼ばれて無限再帰になります。
      回避策は string(n) にキャストすることです。
    explanation_en: |-
      `%v` calls `String()` for types that implement the `fmt.Stringer` interface.
      If `String()` itself uses `fmt.Sprintf("%v", n)`, it calls `String()` again and recurses forever.
      The fix is to cast to `string(n)`.
    answer_code_ref: "code/tesso57_q1_answer.go"
    answer_code_play_ref: "https://go.dev/play/p/jmW7kd-T0UB"

  # tesso57 Q2
  - id: "tesso57_q2"
    title: "fmt verb 逆引き"
    title_en: Reverse lookup for fmt verbs
    mode: "both"
    text: |
      fmt.Printf("????", u) の出力が main.User{Name:"Gopher", Age:10} になるとき、
      ???? に入るのはどれ？
    text_en: |-
      If `fmt.Printf("????", u)` prints `main.User{Name:"Gopher", Age:10}`,
      what should `????` be?
    question_code_ref: "code/tesso57_q2_question.go"
    choices:
      - "%v"
