<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GoCon 2026 Quiz - 管理画面</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/go.min.js"></script>
  <style>
    /* ---- Design tokens (GoCon 2026) ---- */
    :root {
      --primitive-black:      #333333;
      --primitive-light-gray: #d5e1e8;
      --primitive-dark-gray:  #798992;
      --primitive-yellow:     #f4c928;
      --primitive-cyan:       #55d3c2;
      --primitive-blue:       #00c1e5;
      --primitive-navy:       #103972;
      --primitive-white:      #ffffff;
      --primitive-light-blue: #edfcff;
      --primitive-light-cyan: #eefffd;
      --primitive-red:        #fd7045;

      --surface-primary:        var(--primitive-white);
      --surface-secondary:      var(--primitive-light-blue);
      --surface-disabled:       var(--primitive-light-gray);
      --surface-primary-dark:   var(--primitive-red);
      --surface-secondary-dark: var(--primitive-navy);

      --text-primary:   var(--primitive-black);
      --text-secondary: var(--primitive-dark-gray);
      --text-on-fill:   var(--primitive-white);
      --text-accent:    var(--primitive-blue);
      --text-accent2:   var(--primitive-red);

      --radius-button:  999px;
      --radius-objects: 16px;

      --space-xxs: 8px;
      --space-xs:  16px;
      --space-s:   24px;
      --space-m:   40px;
      --space-l:   80px;

      --font-base:   "Noto Sans JP", sans-serif;
      --font-accent: "Barlow", sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-base);
      background: var(--surface-secondary);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.75;
    }

    /* ---- Header ---- */
    .header {
      position: fixed;
      width: 100%;
      top: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 40px;
      height: 81px;
      background: var(--surface-primary);
      box-shadow: 0 1px 0 var(--surface-disabled);
      z-index: 1000;
    }
    .header-logo {
      display: flex;
      align-items: baseline;
      gap: var(--space-xxs);
      font-family: var(--font-accent);
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--primitive-navy);
      text-decoration: none;
      letter-spacing: 0.02em;
    }
    .header-logo .accent { color: var(--text-accent); }
    .header-tagline {
      font-family: var(--font-base);
      font-size: 0.8rem;
      font-weight: 400;
      color: var(--text-secondary);
    }
    .header-badge {
      font-family: var(--font-base);
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-on-fill);
      background: var(--surface-secondary-dark);
      border-radius: var(--radius-objects);
      padding: 2px 10px;
      letter-spacing: 0.04em;
    }

    /* ---- Main ---- */
    .main-content { padding-top: 81px; }
    main {
      max-width: 960px;
      margin: 0 auto;
      padding: var(--space-m) var(--space-xs);
    }
    .page-title {
      font-family: var(--font-accent);
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--primitive-navy);
      margin-bottom: var(--space-xs);
      line-height: 1.5;
    }

    /* ---- Card ---- */
    .card {
      background: var(--surface-primary);
      border-radius: var(--radius-objects);
      box-shadow: 0 2px 12px rgba(16, 57, 114, 0.06);
      overflow: hidden;
      margin-bottom: var(--space-xs);
    }

    /* ---- Table ---- */
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
    }
    .table-scroll {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .stats-table { min-width: 560px; }
    .quiz-list-table { min-width: 360px; }
    thead {
      background: var(--surface-secondary);
      border-bottom: 2px solid var(--surface-disabled);
    }
    th {
      padding: var(--space-xs) var(--space-s);
      text-align: left;
      color: var(--primitive-navy);
      font-weight: 700;
      white-space: nowrap;
    }
    td {
      padding: var(--space-xs) var(--space-s);
      border-bottom: 1px solid var(--surface-secondary);
      vertical-align: middle;
    }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: #f7fdff; }

    /* ---- Progress bar ---- */
    .bar-wrap {
      display: flex;
      align-items: center;
      gap: var(--space-xxs);
    }
    .bar-track {
      background: var(--surface-disabled);
      border-radius: 999px;
      height: 8px;
      width: 140px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 999px;
      background: var(--primitive-blue);
      transition: width 0.4s ease;
    }
    .rate-text {
      min-width: 52px;
      text-align: right;
      font-weight: 700;
      color: var(--primitive-navy);
      font-size: 0.9rem;
    }

    /* ---- Button ---- */
    .c-button {
      appearance: none;
      border: 2px solid transparent;
      border-radius: var(--radius-button);
      padding: var(--space-xs) var(--space-s);
      background: var(--surface-secondary-dark);
      color: var(--text-on-fill);
      font-family: var(--font-base);
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.75;
      cursor: pointer;
      display: inline-block;
      text-align: center;
      transition: opacity 160ms ease;
    }
    .c-button:not(:disabled):hover { opacity: 0.88; }

    .action-bar {
      display: none;
      gap: var(--space-xs);
      flex-wrap: wrap;
    }
    #refresh-btn {
      display: none;
    }
    .page-tabs {
      display: flex;
      gap: var(--space-xxs);
      margin-bottom: var(--space-xs);
      flex-wrap: wrap;
    }
    .page-tab {
      appearance: none;
      border: 2px solid var(--surface-disabled);
      border-radius: 999px;
      background: var(--surface-primary);
      color: var(--primitive-navy);
      cursor: pointer;
      font-family: var(--font-base);
      font-size: 0.95rem;
      font-weight: 700;
      padding: 10px 18px;
      transition: background-color 160ms ease, border-color 160ms ease, color 160ms ease;
    }
    .page-tab.active {
      background: var(--surface-secondary-dark);
      border-color: var(--surface-secondary-dark);
      color: var(--text-on-fill);
    }

    /* ---- Loading / Error ---- */
    #loading {
      text-align: center;
      padding: var(--space-l);
      color: var(--text-secondary);
    }
    .spinner {
      display: inline-block;
      width: 36px;
      height: 36px;
      border: 3px solid var(--surface-disabled);
      border-top-color: var(--text-accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: var(--space-xs);
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #error-msg {
      display: none;
      background: #fff4f1;
      border: 1px solid var(--surface-primary-dark);
      border-radius: var(--radius-objects);
      color: var(--surface-primary-dark);
      padding: var(--space-xs) var(--space-s);
      margin-bottom: var(--space-xs);
    }

    .empty-msg {
      text-align: center;
      padding: var(--space-m);
      color: var(--text-secondary);
    }

    /* ---- Clickable row ---- */
    tbody tr { cursor: pointer; }

    /* ---- Side panel ---- */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(16, 57, 114, 0.45);
      z-index: 2000;
      align-items: flex-start;
      justify-content: flex-start;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--surface-primary);
      box-shadow: 0 8px 40px rgba(16, 57, 114, 0.18);
      width: min(760px, 100%);
      min-height: 100dvh;
      position: relative;
      overflow: visible;
    }
    .modal-close {
      position: absolute;
      top: var(--space-s);
      right: var(--space-s);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.25rem;
      color: var(--text-secondary);
      line-height: 1;
      padding: 4px 8px;
      border-radius: 8px;
    }
    .modal-close:hover { background: var(--surface-secondary); }
    .panel-content {
      min-height: 100dvh;
      padding: var(--space-s);
      padding-right: calc(var(--space-s) + 56px);
    }
    .modal-title {
      font-family: var(--font-accent);
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--primitive-navy);
      line-height: 1.4;
      margin-bottom: var(--space-xxs);
    }
    .panel-selected-meta {
      color: var(--text-secondary);
      font-size: 0.9rem;
      margin-bottom: var(--space-xs);
    }
    .modal-section-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-secondary);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-top: var(--space-s);
      margin-bottom: var(--space-xxs);
    }
    .modal-text {
      white-space: pre-wrap;
      font-size: 0.95rem;
      line-height: 1.75;
    }
    .choice-list {
      display: flex;
      flex-direction: column;
      gap: var(--space-xxs);
      margin-top: var(--space-xxs);
    }
    .choice-btn {
      appearance: none;
      background: var(--surface-primary);
      border: 2px solid var(--surface-disabled);
      border-radius: 12px;
      color: var(--text-primary);
      cursor: pointer;
      font-family: var(--font-base);
      font-size: 0.95rem;
      font-weight: 700;
      line-height: 1.6;
      padding: 12px var(--space-xs);
      text-align: left;
      transition: border-color 160ms ease, background 160ms ease;
      width: 100%;
      white-space: normal;
      word-break: break-word;
      overflow-wrap: break-word;
    }
    .choice-btn:hover:not(:disabled) {
      border-color: var(--text-accent);
      background: var(--surface-secondary);
    }
    .choice-btn.correct {
      border-color: var(--primitive-cyan);
      background: var(--primitive-light-cyan);
      color: #1a7a6e;
      font-weight: 700;
    }
    .choice-btn.incorrect {
      border-color: var(--surface-primary-dark);
      background: #fff4f1;
      color: var(--surface-primary-dark);
    }
    .choice-btn:disabled {
      cursor: default;
    }
    .result-card {
      display: none;
      margin-top: var(--space-s);
      padding: var(--space-s);
      background: var(--surface-secondary);
      border: 1px solid var(--surface-disabled);
      border-radius: 12px;
    }
    #modal-result-badge {
      font-family: var(--font-accent);
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: var(--space-xxs);
    }
    #modal-result-badge.correct { color: var(--primitive-cyan); }
    #modal-result-badge.incorrect { color: var(--surface-primary-dark); }
    .answer-summary {
      color: var(--primitive-navy);
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: var(--space-xs);
    }
    .modal-placeholder {
      color: var(--text-secondary);
      font-size: 0.95rem;
      line-height: 1.75;
    }
    #modal-explanation a,
    #modal-play-link {
      color: var(--text-accent);
      text-decoration: none;
      word-break: break-all;
    }
    #modal-explanation a:hover,
    #modal-play-link:hover {
      text-decoration: underline;
    }
    pre {
      background: var(--surface-secondary);
      border: 1px solid var(--surface-disabled);
      border-left: 4px solid var(--text-accent);
      border-radius: 8px;
      padding: var(--space-xs);
      overflow-x: auto;
      font-size: 0.875rem;
      line-height: 1.6;
      margin-top: var(--space-xxs);
    }
    pre code.hljs {
      background: transparent;
      padding: 0;
      font-size: inherit;
    }

    /* ---- Footer ---- */
    .footer-gradient {
      width: 100%;
      height: 8px;
      background: linear-gradient(90deg, var(--primitive-blue), var(--primitive-cyan));
    }
    footer {
      background: var(--surface-secondary);
      padding: var(--space-s) var(--space-m);
      display: flex;
      align-items: center;
      justify-content: center;
      border-top: 1px solid var(--surface-disabled);
    }
    .footer-copyright {
      font-size: 0.875rem;
      color: var(--text-secondary);
    }

    @media (max-width: 768px) {
      .header { padding: 4px var(--space-s); height: 56px; }
      .header-tagline { display: none; }
      .main-content { padding-top: 56px; }
      main { padding: var(--space-s) var(--space-xs); }
      th, td { padding: var(--space-xxs) var(--space-xs); }
      .bar-track { width: 80px; }
      .action-bar { flex-direction: column; }
      .page-tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }
      .page-tab {
        width: 100%;
        padding: 12px 10px;
        font-size: 0.9rem;
      }
      .modal { width: 100%; }
      .panel-content {
        min-height: 100dvh;
        padding: var(--space-s) var(--space-xs);
      }
      .modal-title {
        padding-right: 40px;
        font-size: 1.15rem;
      }
      .panel-selected-meta,
      .modal-text,
      .choice-btn,
      .answer-summary {
        font-size: 0.9rem;
      }
      .quiz-list-table { min-width: 280px; }
      .modal-close {
        top: var(--space-xs);
        right: var(--space-xs);
      }
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="header-logo">
      <span class="accent">Go</span>Con 2026 Quiz
      <span class="header-tagline">Go の知識を試してみよう！</span>
    </div>
    <span class="header-badge">管理画面</span>
  </header>

  <div class="main-content">
    <main>
      <h1 class="page-title">管理画面</h1>

      <div class="page-tabs" role="tablist" aria-label="管理画面の表示切り替え">
        <button class="page-tab active" id="stats-tab-btn" type="button" role="tab" aria-selected="true">正答率集計</button>
        <button class="page-tab" id="quiz-list-tab-btn" type="button" role="tab" aria-selected="false">クイズ出題一覧</button>
      </div>

      <div id="loading">
        <div class="spinner"></div>
        <p>データを読み込み中...</p>
      </div>
      <div id="error-msg"></div>

      <div class="card" id="table-wrapper" style="display:none">
        <div class="table-scroll">
          <table class="stats-table">
            <thead>
              <tr>
                <th>問題ID</th>
                <th>回答数</th>
                <th>正解数</th>
                <th colspan="2">正答率</th>
              </tr>
            </thead>
            <tbody id="stats-body"></tbody>
          </table>
        </div>
      </div>

      <div class="card" id="quiz-list-wrapper" style="display:none">
        <div class="table-scroll">
          <table class="quiz-list-table">
            <thead>
              <tr>
                <th>問題ID</th>
                <th>タイトル</th>
              </tr>
            </thead>
            <tbody id="quiz-list-body"></tbody>
          </table>
        </div>
      </div>

      <div class="action-bar" id="action-bar">
        <button class="c-button" id="refresh-btn">更新</button>
      </div>
    </main>
  </div>

  <div class="footer-gradient"></div>
  <footer>
    <p class="footer-copyright">© 2026 Go Conference Organizing Team</p>
  </footer>

  <!-- Question preview side panel -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal-close" id="modal-close" aria-label="閉じる">✕</button>
      <div class="panel-content">
        <div class="modal-title" id="modal-title">問題を選択してください</div>
        <div class="panel-selected-meta" id="panel-selected-meta">一覧から問題を選ぶと詳細を表示します。</div>
        <div class="modal-section-label">問題文</div>
        <div class="modal-text modal-placeholder" id="modal-text">左の一覧から問題を選択してください。</div>
        <div id="modal-question-code-wrap" style="display:none">
          <div class="modal-section-label">問題コード</div>
          <pre><code class="language-go" id="modal-question-code"></code></pre>
        </div>
        <div class="modal-section-label" style="margin-top:var(--space-s)">選択肢</div>
        <div class="choice-list" id="modal-choices"></div>
        <div class="result-card" id="modal-result">
          <div id="modal-result-badge"></div>
          <div class="answer-summary" id="modal-answer-summary"></div>
          <div class="modal-section-label" style="margin-top:0">解説</div>
          <div class="modal-text" id="modal-explanation"></div>
          <div id="modal-answer-code-wrap" style="display:none">
            <div class="modal-section-label">解答コード</div>
            <pre id="modal-answer-code-block"><code class="language-go" id="modal-answer-code"></code></pre>
            <a id="modal-play-link" href="#" target="_blank" rel="noopener"
               style="display:none;margin-top:var(--space-xxs);font-size:0.85rem">
              ▶ Go Playground で確認する
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function buildAdminAPIURL(path) {
      let basePath = window.location.pathname;
      if (basePath.endsWith('/index.html')) {
        basePath = basePath.slice(0, -'/index.html'.length);
      }
      if (basePath.endsWith('/')) {
        basePath = basePath.slice(0, -1);
      }
      return `${basePath}/api/${path}`;
    }

    const loading           = document.getElementById('loading');
    const errorMsg          = document.getElementById('error-msg');
    const tableWrapper      = document.getElementById('table-wrapper');
    const quizListWrapper   = document.getElementById('quiz-list-wrapper');
    const statsBody         = document.getElementById('stats-body');
    const quizListBody      = document.getElementById('quiz-list-body');
    const actionBar         = document.getElementById('action-bar');
    const refreshBtn        = document.getElementById('refresh-btn');
    const statsTabBtn       = document.getElementById('stats-tab-btn');
    const quizListTabBtn    = document.getElementById('quiz-list-tab-btn');

    const modalOverlay      = document.getElementById('modal-overlay');
    const modalClose        = document.getElementById('modal-close');
    const modalTitle        = document.getElementById('modal-title');
    const panelSelectedMeta = document.getElementById('panel-selected-meta');
    const modalText         = document.getElementById('modal-text');
    const modalChoices      = document.getElementById('modal-choices');
    const modalResult       = document.getElementById('modal-result');
    const modalResultBadge  = document.getElementById('modal-result-badge');
    const modalAnswerSummary = document.getElementById('modal-answer-summary');
    const modalExplanation  = document.getElementById('modal-explanation');
    const modalQCodeWrap    = document.getElementById('modal-question-code-wrap');
    const modalQCode        = document.getElementById('modal-question-code');
    const modalACodeWrap    = document.getElementById('modal-answer-code-wrap');
    const modalACodeBlock   = document.getElementById('modal-answer-code-block');
    const modalACode        = document.getElementById('modal-answer-code');
    const modalPlayLink     = document.getElementById('modal-play-link');

    let allQuizzes = {};     // id -> AdminQuizDetail
    let quizOrder  = [];     // 表示順を保持
    let statsList  = [];
    let activeTab  = 'stats';
    let selectedQuizId = '';
    let selectedAnswerIndex = null;
    let isLoading = false;

    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function linkify(text) {
      return escapeHtml(text).replace(
        /(https?:\/\/[^\s]+)/g,
        '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>'
      );
    }

    function setHighlightedCode(el, code) {
      el.textContent = code;
      el.removeAttribute('data-highlighted');
      el.classList.remove('hljs');
      hljs.highlightElement(el);
    }

    function syncPageTabs() {
      const isStatsTab = activeTab === 'stats';
      statsTabBtn.classList.toggle('active', isStatsTab);
      quizListTabBtn.classList.toggle('active', !isStatsTab);
      statsTabBtn.setAttribute('aria-selected', String(isStatsTab));
      quizListTabBtn.setAttribute('aria-selected', String(!isStatsTab));

      if (isLoading) {
        tableWrapper.style.display = 'none';
        quizListWrapper.style.display = 'none';
        return;
      }

      tableWrapper.style.display = isStatsTab ? 'block' : 'none';
      quizListWrapper.style.display = isStatsTab ? 'none' : 'block';
    }

    function renderQuizList() {
      quizListBody.innerHTML = '';
      if (quizOrder.length === 0) {
        quizListBody.innerHTML = '<tr><td colspan="2" class="empty-msg">表示できるクイズがありません</td></tr>';
        return;
      }

      quizOrder.forEach(id => {
        const quiz = allQuizzes[id];
        if (!quiz) return;

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${escapeHtml(quiz.id)}</td>
          <td>${escapeHtml(quiz.title)}</td>
        `;
        tr.addEventListener('click', () => openPanel(quiz.id));
        quizListBody.appendChild(tr);
      });
    }

    function renderStatsList() {
      statsBody.innerHTML = '';

      const statsByID = new Map(statsList.map(stat => [stat.question_id, stat]));
      const renderedIDs = new Set();

      if (quizOrder.length === 0) {
        if (statsList.length === 0) {
          statsBody.innerHTML = '<tr><td colspan="5" class="empty-msg">表示できるクイズがありません</td></tr>';
          return;
        }

        statsList.forEach(stat => {
          const tr = document.createElement('tr');
          const rate = stat.correct_rate.toFixed(1);
          tr.innerHTML = `
            <td>${escapeHtml(stat.question_id)}</td>
            <td>${stat.total}</td>
            <td>${stat.correct}</td>
            <td><span class="rate-text">${rate}%</span></td>
            <td>
              <div class="bar-wrap">
                <div class="bar-track">
                  <div class="bar-fill" style="width:${Math.min(rate, 100)}%"></div>
                </div>
              </div>
            </td>
          `;
          if (allQuizzes[stat.question_id]) {
            tr.addEventListener('click', () => openPanel(stat.question_id));
          }
          statsBody.appendChild(tr);
        });
        return;
      }

      quizOrder.forEach(id => {
        const stat = statsByID.get(id) || { question_id: id, total: 0, correct: 0, correct_rate: 0 };
        renderedIDs.add(id);

        const rate = Number(stat.correct_rate).toFixed(1);
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${escapeHtml(id)}</td>
          <td>${stat.total}</td>
          <td>${stat.correct}</td>
          <td><span class="rate-text">${rate}%</span></td>
          <td>
            <div class="bar-wrap">
              <div class="bar-track">
                <div class="bar-fill" style="width:${Math.min(rate, 100)}%"></div>
              </div>
            </div>
          </td>
        `;
        if (allQuizzes[id]) {
          tr.addEventListener('click', () => openPanel(id));
        }
        statsBody.appendChild(tr);
      });

      statsList.forEach(stat => {
        if (renderedIDs.has(stat.question_id)) return;

        const rate = stat.correct_rate.toFixed(1);
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${escapeHtml(stat.question_id)}</td>
          <td>${stat.total}</td>
          <td>${stat.correct}</td>
          <td><span class="rate-text">${rate}%</span></td>
          <td>
            <div class="bar-wrap">
              <div class="bar-track">
                <div class="bar-fill" style="width:${Math.min(rate, 100)}%"></div>
              </div>
            </div>
          </td>
        `;
        if (allQuizzes[stat.question_id]) {
          tr.addEventListener('click', () => openPanel(stat.question_id));
        }
        statsBody.appendChild(tr);
      });
    }

    function renderSelectedQuiz() {
      const quiz = allQuizzes[selectedQuizId];
      if (!quiz) {
        modalTitle.textContent = '問題を選択してください';
        panelSelectedMeta.textContent = '一覧から問題を選ぶと詳細を表示します。';
        modalText.textContent = '左の一覧から問題を選択してください。';
        modalText.classList.add('modal-placeholder');
        modalChoices.innerHTML = '';
        modalResult.style.display = 'none';
        modalResultBadge.textContent = '';
        modalResultBadge.className = '';
        modalAnswerSummary.textContent = '';
        modalExplanation.innerHTML = '';
        modalQCodeWrap.style.display = 'none';
        modalACodeWrap.style.display = 'none';
        return;
      }

      const hasAnswered = Number.isInteger(selectedAnswerIndex);

      modalTitle.textContent = quiz.title;
      panelSelectedMeta.textContent = hasAnswered
        ? `${quiz.id} • ${selectedAnswerIndex === quiz.answer ? '正解' : '不正解'}`
        : `${quiz.id} • 選択肢を選ぶと解答と解説を表示します`;
      modalText.textContent = quiz.text;
      modalText.classList.remove('modal-placeholder');

      if (quiz.question_code) {
        setHighlightedCode(modalQCode, quiz.question_code);
        modalQCodeWrap.style.display = 'block';
      } else {
        modalQCodeWrap.style.display = 'none';
      }

      modalChoices.innerHTML = '';
      quiz.choices.forEach((choice, i) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'choice-btn';
        button.textContent = choice;

        if (hasAnswered) {
          button.disabled = true;
          if (i === quiz.answer) {
            button.classList.add('correct');
          } else if (i === selectedAnswerIndex) {
            button.classList.add('incorrect');
          }
        } else {
          button.addEventListener('click', () => {
            selectedAnswerIndex = i;
            renderSelectedQuiz();
          });
        }

        modalChoices.appendChild(button);
      });

      if (!hasAnswered) {
        modalResult.style.display = 'none';
        modalResultBadge.textContent = '';
        modalResultBadge.className = '';
        modalAnswerSummary.textContent = '';
        modalExplanation.innerHTML = '';
        modalACodeWrap.style.display = 'none';
        modalPlayLink.style.display = 'none';
      } else {
        modalResult.style.display = 'block';
        modalResultBadge.textContent = selectedAnswerIndex === quiz.answer ? '正解！' : '不正解...';
        modalResultBadge.className = selectedAnswerIndex === quiz.answer ? 'correct' : 'incorrect';
        modalAnswerSummary.textContent = `正解: ${quiz.choices[quiz.answer]}`;
        modalExplanation.innerHTML = linkify(quiz.explanation);

        if (quiz.answer_code || quiz.answer_code_play_ref) {
          modalACodeWrap.style.display = 'block';
          if (quiz.answer_code) {
            setHighlightedCode(modalACode, quiz.answer_code);
            modalACodeBlock.style.display = 'block';
          } else {
            modalACodeBlock.style.display = 'none';
          }
          if (quiz.answer_code_play_ref) {
            modalPlayLink.href = quiz.answer_code_play_ref;
            modalPlayLink.style.display = 'inline-block';
          } else {
            modalPlayLink.style.display = 'none';
          }
        } else {
          modalACodeWrap.style.display = 'none';
          modalPlayLink.style.display = 'none';
        }
      }
    }

    function openPanel(quizId) {
      selectedQuizId = quizId;
      selectedAnswerIndex = null;
      renderSelectedQuiz();
      modalOverlay.classList.add('open');
    }

    function closeModal() {
      selectedAnswerIndex = null;
      modalOverlay.classList.remove('open');
    }

    modalClose.addEventListener('click', closeModal);
    modalOverlay.addEventListener('click', e => { if (e.target === modalOverlay) closeModal(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
    statsTabBtn.addEventListener('click', () => {
      activeTab = 'stats';
      syncPageTabs();
    });
    quizListTabBtn.addEventListener('click', () => {
      activeTab = 'quiz-list';
      syncPageTabs();
    });

    async function loadQuizzes() {
      try {
        const res = await fetch(buildAdminAPIURL('quizzes'));
        if (!res.ok) return;
        const list = await res.json();
        allQuizzes = {};
        quizOrder = [];
        list.forEach(q => {
          allQuizzes[q.id] = q;
          quizOrder.push(q.id);
        });
        renderQuizList();
        renderStatsList();
        actionBar.style.display = 'flex';
        if (modalOverlay.classList.contains('open') && selectedQuizId) {
          renderSelectedQuiz();
        }
      } catch (_) {}
    }

    async function loadStats() {
      isLoading = true;
      loading.style.display      = 'block';
      errorMsg.style.display     = 'none';
      statsBody.innerHTML        = '';
      syncPageTabs();

      try {
        const res = await fetch(buildAdminAPIURL('stats'));
        if (!res.ok) throw new Error('データの取得に失敗しました');
        const stats = await res.json();
        statsList = stats || [];
        renderStatsList();

        isLoading = false;
        loading.style.display      = 'none';
        actionBar.style.display    = 'flex';
        refreshBtn.style.display   = 'inline-block';
        syncPageTabs();
      } catch (e) {
        statsList = [];
        renderStatsList();
        isLoading = false;
        loading.style.display  = 'none';
        errorMsg.textContent   = e.message;
        errorMsg.style.display = 'block';
        actionBar.style.display = 'flex';
        refreshBtn.style.display = 'inline-block';
        syncPageTabs();
      }
    }

    async function refreshData() {
      await loadQuizzes();
      await loadStats();
    }

    refreshBtn.addEventListener('click', refreshData);
    refreshData();
  </script>
</body>
</html>
