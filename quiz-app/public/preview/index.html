<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Go Conference 2026 CodeLab - 問題一覧</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/go.min.js"></script>
  <script src="../quiz-config.js"></script>
  <script src="../quiz-data.js"></script>
  <style>
    :root {
      --primitive-black:      #333333;
      --primitive-light-gray: #d5e1e8;
      --primitive-dark-gray:  #798992;
      --primitive-blue:       #00c1e5;
      --primitive-navy:       #103972;
      --primitive-white:      #ffffff;
      --primitive-light-blue: #edfcff;
      --primitive-light-cyan: #eefffd;
      --primitive-red:        #fd7045;
      --primitive-cyan:       #55d3c2;

      --surface-primary:        var(--primitive-white);
      --surface-secondary:      var(--primitive-light-blue);
      --surface-disabled:       var(--primitive-light-gray);
      --surface-primary-dark:   var(--primitive-red);
      --surface-secondary-dark: var(--primitive-navy);

      --text-primary:   var(--primitive-black);
      --text-secondary: var(--primitive-dark-gray);
      --text-on-fill:   var(--primitive-white);
      --text-accent:    var(--primitive-blue);

      --radius-button:  999px;
      --radius-objects: 16px;

      --space-xxs: 8px;
      --space-xs:  16px;
      --space-s:   24px;
      --space-m:   40px;

      --font-base:   "Noto Sans JP", sans-serif;
      --font-accent: "Barlow", sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-base);
      background: var(--surface-secondary);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.75;
    }

    .header {
      position: fixed;
      inset: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-xs);
      padding: 4px 40px;
      height: 81px;
      background: var(--surface-primary);
      box-shadow: 0 1px 0 var(--surface-disabled);
      z-index: 1000;
    }
    .header-logo {
      display: flex;
      align-items: center;
      min-width: 0;
    }
    .header-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .header-conference-logo {
      display: block;
      width: min(136px, 42vw);
      height: auto;
      flex-shrink: 0;
    }
    .header-product-mark {
      font-family: var(--font-accent);
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--primitive-navy);
      letter-spacing: 0.02em;
      white-space: nowrap;
    }
    .header-actions {
      display: flex;
      align-items: center;
      margin-left: auto;
      flex-shrink: 0;
    }
    .language-switch {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: flex-end;
    }
    .language-toggle {
      appearance: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border: 1px solid var(--surface-disabled);
      border-radius: 999px;
      background: var(--surface-secondary);
      color: var(--text-secondary);
      cursor: pointer;
      transition: background-color 160ms ease, color 160ms ease, box-shadow 160ms ease, border-color 160ms ease;
    }
    .language-toggle:hover,
    .language-switch.open .language-toggle {
      background: var(--surface-primary);
      color: var(--primitive-navy);
      box-shadow: 0 1px 4px rgba(16, 57, 114, 0.12);
    }
    .language-toggle:focus-visible {
      outline: 2px solid var(--text-accent);
      outline-offset: 2px;
    }
    .language-toggle-icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }
    .language-menu {
      position: absolute;
      top: calc(100% + var(--space-xxs));
      right: 0;
      display: none;
      flex-direction: column;
      gap: 4px;
      min-width: 148px;
      padding: 8px;
      border: 1px solid var(--surface-disabled);
      border-radius: 16px;
      background: var(--surface-primary);
      box-shadow: 0 14px 32px rgba(16, 57, 114, 0.14);
    }
    .language-menu.open {
      display: flex;
    }
    .language-menu-item {
      appearance: none;
      width: 100%;
      border: none;
      border-radius: 12px;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      font-family: var(--font-base);
      font-size: 0.9rem;
      font-weight: 700;
      line-height: 1.4;
      padding: 10px 12px;
      text-align: left;
      transition: background-color 160ms ease, color 160ms ease;
    }
    .language-menu-item:hover,
    .language-menu-item.active {
      background: var(--surface-secondary);
      color: var(--primitive-navy);
    }
    .language-menu-item:focus-visible {
      outline: 2px solid var(--text-accent);
      outline-offset: 2px;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .main-content { padding-top: 81px; }
    main {
      max-width: 960px;
      margin: 0 auto;
      padding: var(--space-m) var(--space-xs);
    }

    .toolbar {
      margin-bottom: var(--space-xs);
    }
    .back-link {
      color: var(--text-accent);
      text-decoration: none;
      font-weight: 700;
    }
    .back-link:hover { text-decoration: underline; }

    .page-title {
      font-family: var(--font-accent);
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--primitive-navy);
      margin-bottom: var(--space-xxs);
    }
    .page-lead {
      color: var(--text-secondary);
      margin-bottom: var(--space-s);
    }

    .card {
      background: var(--surface-primary);
      border-radius: var(--radius-objects);
      box-shadow: 0 2px 12px rgba(16, 57, 114, 0.06);
      overflow: hidden;
      margin-bottom: var(--space-xs);
    }
    .table-scroll {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 360px;
    }
    thead {
      background: var(--surface-secondary);
      border-bottom: 2px solid var(--surface-disabled);
    }
    th, td {
      padding: var(--space-xs) var(--space-s);
      text-align: left;
    }
    th {
      color: var(--primitive-navy);
      font-weight: 700;
      white-space: nowrap;
    }
    td {
      border-bottom: 1px solid var(--surface-secondary);
      vertical-align: middle;
    }
    tbody tr { cursor: pointer; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: #f7fdff; }
    .empty-msg {
      text-align: center;
      color: var(--text-secondary);
      padding: var(--space-m);
    }

    #error-msg {
      display: none;
      background: #fff4f1;
      border: 1px solid var(--surface-primary-dark);
      border-radius: var(--radius-objects);
      color: var(--surface-primary-dark);
      padding: var(--space-xs) var(--space-s);
      margin-bottom: var(--space-xs);
    }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(16, 57, 114, 0.45);
      z-index: 2000;
      align-items: flex-start;
      justify-content: flex-start;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--surface-primary);
      box-shadow: 0 8px 40px rgba(16, 57, 114, 0.18);
      width: min(760px, 100%);
      min-height: 100dvh;
      position: relative;
    }
    .modal-close {
      position: absolute;
      top: var(--space-s);
      right: var(--space-s);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.25rem;
      color: var(--text-secondary);
      line-height: 1;
      padding: 4px 8px;
      border-radius: 8px;
    }
    .modal-close:hover { background: var(--surface-secondary); }
    .panel-content {
      min-height: 100dvh;
      padding: var(--space-s);
      padding-right: calc(var(--space-s) + 56px);
    }
    .modal-title {
      font-family: var(--font-accent);
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--primitive-navy);
      margin-bottom: var(--space-xxs);
      line-height: 1.4;
    }
    .panel-selected-meta {
      color: var(--text-secondary);
      font-size: 0.9rem;
      margin-bottom: var(--space-xs);
    }
    .modal-section-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-secondary);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-top: var(--space-s);
      margin-bottom: var(--space-xxs);
    }
    .modal-text {
      white-space: pre-wrap;
      font-size: 0.95rem;
      line-height: 1.75;
    }
    .choice-list {
      display: flex;
      flex-direction: column;
      gap: var(--space-xxs);
      margin-top: var(--space-xxs);
    }
    .choice-btn {
      appearance: none;
      background: var(--surface-primary);
      border: 2px solid var(--surface-disabled);
      border-radius: 12px;
      color: var(--text-primary);
      cursor: pointer;
      font-family: var(--font-base);
      font-size: 0.95rem;
      font-weight: 700;
      line-height: 1.6;
      padding: 12px var(--space-xs);
      text-align: left;
      width: 100%;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: break-word;
    }
    .choice-btn:hover:not(:disabled) {
      border-color: var(--text-accent);
      background: var(--surface-secondary);
    }
    .choice-btn.correct {
      border-color: var(--primitive-cyan);
      background: var(--primitive-light-cyan);
      color: #1a7a6e;
    }
    .choice-btn.incorrect {
      border-color: var(--surface-primary-dark);
      background: #fff4f1;
      color: var(--surface-primary-dark);
    }
    .choice-btn:disabled { cursor: default; }
    .result-card {
      display: none;
      margin-top: var(--space-s);
      padding: var(--space-s);
      background: var(--surface-secondary);
      border: 1px solid var(--surface-disabled);
      border-radius: 12px;
    }
    #modal-result-badge {
      font-family: var(--font-accent);
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: var(--space-xxs);
    }
    #modal-result-badge.correct { color: var(--primitive-cyan); }
    #modal-result-badge.incorrect { color: var(--surface-primary-dark); }
    .answer-summary {
      color: var(--primitive-navy);
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: var(--space-xs);
    }
    pre {
      background: var(--surface-secondary);
      border: 1px solid var(--surface-disabled);
      border-left: 4px solid var(--text-accent);
      border-radius: 8px;
      padding: var(--space-xs);
      overflow-x: auto;
      font-size: 0.875rem;
      line-height: 1.6;
      margin-top: var(--space-xxs);
    }
    pre code.hljs {
      background: transparent;
      padding: 0;
      font-size: inherit;
    }
    .inline-code {
      margin: 0 0.08em;
      padding: 0.08em 0.45em;
      border: 1px solid rgba(16, 57, 114, 0.12);
      border-radius: 6px;
      background: rgba(16, 57, 114, 0.08);
      color: var(--primitive-navy);
      font-family: ui-monospace, SFMono-Regular, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 0.92em;
      font-weight: 700;
      line-height: 1.4;
    }
    .choice-btn .inline-code {
      color: inherit;
    }
    #modal-explanation a,
    #modal-play-link {
      color: var(--text-accent);
      text-decoration: none;
      word-break: break-all;
    }
    #modal-explanation a:hover,
    #modal-play-link:hover {
      text-decoration: underline;
    }

    .footer-gradient {
      width: 100%;
      height: 8px;
      background: linear-gradient(90deg, var(--primitive-blue), var(--primitive-cyan));
    }
    footer {
      background: var(--surface-secondary);
      padding: var(--space-s) var(--space-m);
      border-top: 1px solid var(--surface-disabled);
    }
    .footer-info {
      width: min(760px, 100%);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
    }
    .logo-container {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
      color: var(--primitive-navy);
      font-family: var(--font-accent);
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .footer-logo {
      display: block;
      width: min(196px, 100%);
      height: auto;
    }
    .copyright {
      font-size: 0.875rem;
      color: var(--text-secondary);
    }
    .copyright a {
      color: var(--primitive-blue);
      font-weight: 700;
      text-decoration: none;
    }
    .copyright a:hover {
      text-decoration: underline;
    }

    @media (max-width: 768px) {
      .header { padding: 4px var(--space-s); height: 56px; }
      .header-conference-logo {
        width: 112px;
      }
      .header-product-mark {
        font-size: 1.25rem;
      }
      .language-toggle {
        width: 40px;
        height: 40px;
      }
      .language-menu {
        min-width: 136px;
      }
      .main-content { padding-top: 56px; }
      main { padding: var(--space-s) var(--space-xs); }
      th, td { padding: var(--space-xxs) var(--space-xs); }
      .modal { width: 100%; }
      .panel-content {
        min-height: 100dvh;
        padding: var(--space-s) var(--space-xs);
      }
      .modal-close {
        top: var(--space-xs);
        right: var(--space-xs);
      }
      .modal-title {
        padding-right: 40px;
        font-size: 1.15rem;
      }
      footer {
        padding: var(--space-s) var(--space-xs);
      }
      .footer-info,
      .logo-container {
        align-items: center;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-logo">
      <div class="header-brand">
        <img class="header-conference-logo" src="../assets/go-conference-2026-logo.svg" alt="Go Conference 2026">
        <span class="header-product-mark">CodeLab</span>
      </div>
    </div>
    <div class="header-actions">
      <div class="language-switch" id="language-switch">
        <button
          class="language-toggle"
          id="language-toggle-btn"
          type="button"
          aria-label="表示言語"
          aria-haspopup="true"
          aria-controls="language-menu"
          aria-expanded="false"
          title="表示言語"
        >
          <svg class="language-toggle-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M12 2.75c5.108 0 9.25 4.142 9.25 9.25S17.108 21.25 12 21.25 2.75 17.108 2.75 12 6.892 2.75 12 2.75Zm0 0c1.98 0 3.75 4.142 3.75 9.25S13.98 21.25 12 21.25 8.25 17.108 8.25 12 10.02 2.75 12 2.75Zm-8.9 6.5h17.8M3.1 14.75h17.8M12 2.75V21.25" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="sr-only" id="language-toggle-label">表示言語</span>
        </button>
        <div class="language-menu" id="language-menu">
          <button class="language-menu-item" id="lang-ja-btn" type="button">日本語</button>
          <button class="language-menu-item" id="lang-en-btn" type="button">English</button>
        </div>
      </div>
    </div>
  </header>

  <div class="main-content">
    <main>
      <div class="toolbar">
        <a class="back-link" id="back-link" href="../">← トップへ戻る</a>
      </div>
      <h1 class="page-title" id="page-title">クイズ出題一覧</h1>
      <p class="page-lead" id="page-lead">一覧から問題を選ぶと、解説・コード付きで内容を閲覧できます。</p>
      <div id="error-msg"></div>

      <div class="card">
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th id="quiz-list-header">問題ID</th>
              </tr>
            </thead>
            <tbody id="quiz-list-body"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <div class="footer-gradient"></div>
  <footer id="footer-copyright">
      <div class="footer-info">
        <div class="logo-container">
          <img class="footer-logo" src="../assets/go-conference-2026-logo.svg" alt="Go Conference 2026">
          <span>Go Conference 2026</span>
        </div>
        <p class="copyright" id="footer-attribution">
          The Go gopher was designed by <a href="https://reneefrench.blogspot.com/">Renée French</a>. Illustrations by
          <a href="https://x.com/avocadoneko">avocadoneko</a>.
        </p>
    </div>
  </footer>

  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal-close" id="modal-close" aria-label="閉じる">✕</button>
      <div class="panel-content">
        <div class="modal-title" id="modal-title">問題を選択してください</div>
        <div class="panel-selected-meta" id="panel-selected-meta">一覧から問題を選ぶと詳細を表示します。</div>
        <div class="modal-section-label" id="modal-text-label">問題文</div>
        <div class="modal-text" id="modal-text"></div>
        <div id="modal-question-code-wrap" style="display:none">
          <div class="modal-section-label" id="modal-question-code-label">問題コード</div>
          <pre><code class="language-go" id="modal-question-code"></code></pre>
        </div>
        <div class="modal-section-label" id="modal-choices-label">選択肢</div>
        <div class="choice-list" id="modal-choices"></div>
        <div class="result-card" id="modal-result">
          <div id="modal-result-badge"></div>
          <div class="answer-summary" id="modal-answer-summary"></div>
          <div class="modal-section-label" id="modal-explanation-label" style="margin-top:0">解説</div>
          <div class="modal-text" id="modal-explanation"></div>
          <div id="modal-answer-code-wrap" style="display:none">
            <div class="modal-section-label" id="modal-answer-code-label">解答コード</div>
            <pre id="modal-answer-code-block"><code class="language-go" id="modal-answer-code"></code></pre>
            <a id="modal-play-link" href="#" target="_blank" rel="noopener" style="display:none;margin-top:var(--space-xxs);font-size:0.85rem">
              ▶ Go Playground で確認する
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

        modalChoicesLabel: 'Choices',
        modalExplanationLabel: 'Explanation',
        modalAnswerCodeLabel: 'Answer code',
        modalPlayLink: '▶ View on Go Playground',
        correctBadge: 'Correct!',
        incorrectBadge: 'Incorrect...',
        answerSummary: ({ answer }) => `Correct answer: ${answer}`,
      },
    };

    let hasPreviewAccess = false;
    try {
      hasPreviewAccess = window.sessionStorage.getItem(previewStorageKey) === '1';
    } catch (_) {}
    if (!hasPreviewAccess) {
      window.location.replace('../');
    }

    const languageSwitch = document.getElementById('language-switch');
    const languageToggleBtn = document.getElementById('language-toggle-btn');
    const languageToggleLabel = document.getElementById('language-toggle-label');
    const languageMenu = document.getElementById('language-menu');
    const langJaBtn = document.getElementById('lang-ja-btn');
    const langEnBtn = document.getElementById('lang-en-btn');
    const backLink = document.getElementById('back-link');
    const pageTitle = document.getElementById('page-title');
    const pageLead = document.getElementById('page-lead');
    const quizListHeader = document.getElementById('quiz-list-header');
    const footerAttribution = document.getElementById('footer-attribution');
    const errorMsg = document.getElementById('error-msg');
    const quizListBody = document.getElementById('quiz-list-body');
    const modalOverlay = document.getElementById('modal-overlay');
    const modalClose = document.getElementById('modal-close');
    const modalTitle = document.getElementById('modal-title');
    const panelSelectedMeta = document.getElementById('panel-selected-meta');
    const modalTextLabel = document.getElementById('modal-text-label');
    const modalQuestionCodeLabel = document.getElementById('modal-question-code-label');
    const modalChoicesLabel = document.getElementById('modal-choices-label');
    const modalExplanationLabel = document.getElementById('modal-explanation-label');
    const modalAnswerCodeLabel = document.getElementById('modal-answer-code-label');
    const modalText = document.getElementById('modal-text');
    const modalChoices = document.getElementById('modal-choices');
    const modalResult = document.getElementById('modal-result');
    const modalResultBadge = document.getElementById('modal-result-badge');
    const modalAnswerSummary = document.getElementById('modal-answer-summary');
    const modalExplanation = document.getElementById('modal-explanation');
    const modalQCodeWrap = document.getElementById('modal-question-code-wrap');
    const modalQCode = document.getElementById('modal-question-code');
    const modalACodeWrap = document.getElementById('modal-answer-code-wrap');
    const modalACodeBlock = document.getElementById('modal-answer-code-block');
    const modalACode = document.getElementById('modal-answer-code');
    const modalPlayLink = document.getElementById('modal-play-link');

    let currentLanguage = loadLanguage();
    let currentErrorKey = '';
    let selectedQuiz = null;
    let selectedAnswerIndex = null;
    let isLanguageMenuOpen = false;

    function normalizeLanguage(value) {
      return value === 'en' ? 'en' : defaultLanguage;
    }

    function loadLanguage() {
      try {
        return normalizeLanguage(window.localStorage.getItem(languageStorageKey));
      } catch (_) {
        return defaultLanguage;
      }
    }

    function persistLanguage(language) {
      try {
        window.localStorage.setItem(languageStorageKey, language);
      } catch (_) {}
    }

    function setLanguageMenuOpen(isOpen) {
      isLanguageMenuOpen = Boolean(isOpen);
      languageSwitch.classList.toggle('open', isLanguageMenuOpen);
      languageMenu.classList.toggle('open', isLanguageMenuOpen);
      languageToggleBtn.setAttribute('aria-expanded', String(isLanguageMenuOpen));
    }

    function toggleLanguageMenu() {
      setLanguageMenuOpen(!isLanguageMenuOpen);
    }

    function closeLanguageMenu() {
      setLanguageMenuOpen(false);
    }

    function t(key, params = {}) {
      const strings = uiStrings[currentLanguage] || uiStrings[defaultLanguage];
      const fallbackStrings = uiStrings[defaultLanguage];
      const value = strings[key] !== undefined ? strings[key] : fallbackStrings[key];
      return typeof value === 'function' ? value(params) : value;
    }

    function normalizeLocalizedString(value, fallback) {
      if (typeof value === 'string' && value.trim()) {
        return value;
      }
      return typeof fallback === 'string' ? fallback : '';
    }

    function normalizeChoices(choices) {
      if (!Array.isArray(choices)) {
        return [];
      }
      return choices.map(choice => typeof choice === 'string' ? choice : '');
    }

    function normalizeQuizData(quiz) {
      const choices = normalizeChoices(quiz && quiz.choices);
      const rawChoicesEn = normalizeChoices(quiz && quiz.choices_en);
      const choicesEn = rawChoicesEn.length === choices.length
        ? rawChoicesEn.map((choice, index) => choice.trim() ? choice : choices[index])
        : choices.slice();

      return {
        ...quiz,
        title: normalizeLocalizedString(quiz && quiz.title, ''),
        title_en: normalizeLocalizedString(quiz && quiz.title_en, quiz && quiz.title),
        text: normalizeLocalizedString(quiz && quiz.text, ''),
        text_en: normalizeLocalizedString(quiz && quiz.text_en, quiz && quiz.text),
        choices,
        choices_en: choicesEn,
        explanation: normalizeLocalizedString(quiz && quiz.explanation, ''),
        explanation_en: normalizeLocalizedString(quiz && quiz.explanation_en, quiz && quiz.explanation),
      };
    }

    function getQuizTitle(quiz) {
      return currentLanguage === 'en' ? quiz.title_en : quiz.title;
    }

    function getQuizText(quiz) {
      return currentLanguage === 'en' ? quiz.text_en : quiz.text;
    }

    function getQuizExplanation(quiz) {
      return currentLanguage === 'en' ? quiz.explanation_en : quiz.explanation;
    }

    function getQuizChoices(quiz) {
      return currentLanguage === 'en' ? quiz.choices_en : quiz.choices;
    }

    function renderError() {
      if (!currentErrorKey) {
        errorMsg.style.display = 'none';
        errorMsg.textContent = '';
        return;
      }
      errorMsg.textContent = t(currentErrorKey);
      errorMsg.style.display = 'block';
    }

    function showError(messageKey) {
      currentErrorKey = messageKey;
      renderError();
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function linkify(text) {
      return escapeHtml(text).replace(
        /(https?:\/\/[^\s]+)/g,
        '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>'
      );
    }

    function formatInlineText(text, { linkifyUrls = false } = {}) {
      const source = typeof text === 'string' ? text : '';
      return source.split(/(`[^`\n]+`)/g).map(segment => {
        if (segment.startsWith('`') && segment.endsWith('`')) {
          return `<code class="inline-code">${escapeHtml(segment.slice(1, -1))}</code>`;
        }
        return linkifyUrls ? linkify(segment) : escapeHtml(segment);
      }).join('');
    }

    function setHighlightedCode(el, code) {
      el.textContent = code;
      el.removeAttribute('data-highlighted');
      el.classList.remove('hljs');
      hljs.highlightElement(el);
    }

    function applyLanguage() {
      document.documentElement.lang = currentLanguage;
      document.title = t('documentTitle');
      languageToggleBtn.setAttribute('aria-label', t('languageSwitchAria'));
      languageToggleBtn.setAttribute('title', t('languageSwitchAria'));
      languageToggleLabel.textContent = t('languageSwitchAria');
      languageMenu.setAttribute('aria-label', t('languageSwitchAria'));
      langJaBtn.textContent = t('languageJa');
      langEnBtn.textContent = t('languageEn');
      langJaBtn.classList.toggle('active', currentLanguage === 'ja');
      langEnBtn.classList.toggle('active', currentLanguage === 'en');
      langJaBtn.setAttribute('aria-pressed', String(currentLanguage === 'ja'));
      langEnBtn.setAttribute('aria-pressed', String(currentLanguage === 'en'));
      backLink.textContent = t('backLink');
      pageTitle.textContent = t('pageTitle');
      pageLead.textContent = t('pageLead');
      quizListHeader.textContent = t('quizListHeader');
      footerAttribution.innerHTML = t('footerAttributionHtml');
      modalClose.setAttribute('aria-label', t('modalCloseAria'));
      modalTextLabel.textContent = t('modalTextLabel');
      modalQuestionCodeLabel.textContent = t('modalQuestionCodeLabel');
      modalChoicesLabel.textContent = t('modalChoicesLabel');
      modalExplanationLabel.textContent = t('modalExplanationLabel');
      modalAnswerCodeLabel.textContent = t('modalAnswerCodeLabel');
      modalPlayLink.textContent = t('modalPlayLink');
      renderError();
      renderQuizList();
      if (selectedQuiz) {
        renderSelectedQuiz();
      } else {
        modalTitle.textContent = t('modalSelectTitle');
        panelSelectedMeta.textContent = t('modalSelectHint');
      }
    }

    function setLanguage(language) {
      const nextLanguage = normalizeLanguage(language);
      if (currentLanguage === nextLanguage) {
        closeLanguageMenu();
        return;
      }
      currentLanguage = nextLanguage;
      persistLanguage(currentLanguage);
      applyLanguage();
      closeLanguageMenu();
    }

    function renderQuizList() {
      quizListBody.innerHTML = '';

      if (allQuizzes.length === 0) {
        quizListBody.innerHTML = `<tr><td colspan="1" class="empty-msg">${escapeHtml(t('emptyMsg'))}</td></tr>`;
        return;
      }

      allQuizzes.forEach(quiz => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${escapeHtml(quiz.id)}</td>
        `;
        tr.addEventListener('click', () => openPanel(quiz));
        quizListBody.appendChild(tr);
      });
    }

    function renderSelectedQuiz() {
      if (!selectedQuiz) {
        modalTitle.textContent = t('modalSelectTitle');
        panelSelectedMeta.textContent = t('modalSelectHint');
        return;
      }

      const hasAnswered = Number.isInteger(selectedAnswerIndex);
      const choices = getQuizChoices(selectedQuiz);
      const isCorrect = hasAnswered && selectedAnswerIndex === selectedQuiz.answer;

      modalTitle.innerHTML = formatInlineText(getQuizTitle(selectedQuiz) || selectedQuiz.id);
      panelSelectedMeta.textContent = hasAnswered
        ? `${selectedQuiz.id} ・ ${t(isCorrect ? 'modalStatusCorrect' : 'modalStatusIncorrect')}`
        : `${selectedQuiz.id} ・ ${t('modalChooseHint')}`;
      modalText.innerHTML = formatInlineText(getQuizText(selectedQuiz));

      if (selectedQuiz.question_code) {
        setHighlightedCode(modalQCode, selectedQuiz.question_code);
        modalQCodeWrap.style.display = 'block';
      } else {
        modalQCodeWrap.style.display = 'none';
      }

      modalChoices.innerHTML = '';
      choices.forEach((choice, index) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'choice-btn';
        button.innerHTML = formatInlineText(choice);

        if (hasAnswered) {
          button.disabled = true;
          if (index === selectedQuiz.answer) {
            button.classList.add('correct');
          } else if (index === selectedAnswerIndex) {
            button.classList.add('incorrect');
          }
        } else {
          button.addEventListener('click', () => {
            selectedAnswerIndex = index;
            renderSelectedQuiz();
          });
        }

        modalChoices.appendChild(button);
      });

      if (!hasAnswered) {
        modalResult.style.display = 'none';
        modalACodeWrap.style.display = 'none';
        modalPlayLink.style.display = 'none';
        return;
      }

      modalResult.style.display = 'block';
      modalResultBadge.textContent = t(isCorrect ? 'correctBadge' : 'incorrectBadge');
      modalResultBadge.className = isCorrect ? 'correct' : 'incorrect';
      modalAnswerSummary.innerHTML = formatInlineText(t('answerSummary', { answer: choices[selectedQuiz.answer] }));
      modalExplanation.innerHTML = formatInlineText(getQuizExplanation(selectedQuiz), { linkifyUrls: true });

      if (selectedQuiz.answer_code || selectedQuiz.answer_code_play_ref) {
        modalACodeWrap.style.display = 'block';
        if (selectedQuiz.answer_code) {
          setHighlightedCode(modalACode, selectedQuiz.answer_code);
          modalACodeBlock.style.display = 'block';
        } else {
          modalACodeBlock.style.display = 'none';
        }
        if (selectedQuiz.answer_code_play_ref) {
          modalPlayLink.href = selectedQuiz.answer_code_play_ref;
          modalPlayLink.style.display = 'inline-block';
        } else {
          modalPlayLink.style.display = 'none';
        }
      } else {
        modalACodeWrap.style.display = 'none';
        modalPlayLink.style.display = 'none';
      }
    }

    function openPanel(quiz) {
      closeLanguageMenu();
      selectedQuiz = quiz;
      selectedAnswerIndex = null;
      renderSelectedQuiz();
      modalOverlay.classList.add('open');
    }

    function closeModal() {
      selectedAnswerIndex = null;
      modalOverlay.classList.remove('open');
    }

    languageToggleBtn.addEventListener('click', toggleLanguageMenu);
    langJaBtn.addEventListener('click', () => setLanguage('ja'));
    langEnBtn.addEventListener('click', () => setLanguage('en'));
    modalClose.addEventListener('click', closeModal);
    modalOverlay.addEventListener('click', event => {
      if (event.target === modalOverlay) {
        closeModal();
      }
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') {
        closeModal();
        closeLanguageMenu();
      }
    });

    setLanguageMenuOpen(false);
    applyLanguage();
    if (allQuizzes.length === 0) {
      showError('errorQuizLoad');
    }
  </script>
</body>
</html>
