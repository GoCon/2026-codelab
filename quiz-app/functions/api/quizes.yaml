# hasegawa_itsuki Q3
- id: "hasegawa_itsuki_q3"
  title: "ポインタ渡しの更新"
  text: "以下の A〜D のうち、関数を呼んだ後に msg の値が \"Original\" から\"Changed\" に変わるのはどれ？"
  question_code_ref: "code/hasegawa_itsuki_q3_question.go"
  choices:
    - "A. updateA(msg)"
    - "B. updateB(&msg)"
    - "C. updateC(&msg)"
    - "D. updateD(&ptr)"
  answer: 2
  explanation: "A は値渡しなので msg は変わりません。B は *string のコピーを差し替えるだけで msg に影響しません。C は *s = \"Changed\" でポインタの指す先を直接書き換えるため msg が Changed になります。D は ptr の向き先を変えるだけで msg は不変です。"
