# tomtwinkle Q4
- id: "tomtwinkle_q4"
  title: "defer in loop"
  text: |
    以下のコードの問題点は？
  question_code_ref: "code/tomtwinkle_q4_question.go"
  choices:
    - "ループごとにファイルが上書きされる"
    - "defer は関数の終了時に実行されるため、ファイルディスクリプタが枯渇する"
    - "os.Open は defer で閉じることができない"
    - "コンパイルエラーになる"
  answer: 1
  explanation: |
    defer のスコープは「ブロック」ではなく「関数」です。
    ループの中で defer を大量に呼ぶと、関数が終わるまで一切クローズされず、OSのリソース制限に引っかかってパニックになることがあります。
    解決策はループ本体を別関数に切り出すことです。

    Go Blog (defer の仕様): https://go.dev/blog/defer-panic-and-recover
    公式仕様: https://go.dev/ref/spec#Defer_statements
  answer_code_ref: "code/tomtwinkle_q4_answer.go"
  answer_code_play_ref: "https://go.dev/play/p/hM0PTI0iko7"

