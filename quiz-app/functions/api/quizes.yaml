# tomtwinkle Q10
- id: "tomtwinkle_q10"
  title: "synctest isolation"
  text: |
    synctest.Run ブロックの「外側」で起動した goroutine と、「内側」で起動した goroutine 同士が
    channel で同期通信しようとするとどうなる？
  question_code_ref: "code/tomtwinkle_q10_question.go"
  choices:
    - "正常に通信できる"
    - "外側の goroutine が強制終了させられる"
    - "deadlock を検知して panic する"
    - "常に非同期通信（buffered channel）に変換される"
  answer: 2
  explanation: |
    synctest は独自の仮想時計とスケジューラ内で隔離されて動くため、リアルタイムで動く通常の goroutine や本物のネットワーク I/O と直接的な同期通信を行おうとすると、テストの決定性が壊れるためエラーとなります。

    pkg.go.dev (testing/synctest): https://pkg.go.dev/testing/synctest
    Go Blog (synctest): https://go.dev/blog/synctest
    Go 1.24 リリースノート: https://go.dev/doc/go1.24

