name: quiz-app / Test

on:
  pull_request:
    paths:
      - "quiz-app/**/*.go"
      - "quiz-app/go.mod"
      - "quiz-app/go.sum"
      - "quiz-app/Makefile"
      - "quiz-app/terraform/**"
      - ".github/workflows/quiz-app-test.yml"

permissions:
  contents: read

jobs:
  # PR で変更されたファイルパスを検出し、後続ジョブの実行要否を決定する。
  # paths フィルタはワークフロー全体のトリガーにしか使えないため、
  # ジョブ単位の粒度でスキップ制御するためにここで差分を取る。
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      go:        ${{ steps.diff.outputs.go }}
      wasm:      ${{ steps.diff.outputs.wasm }}
      terraform: ${{ steps.diff.outputs.terraform }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0  # base ブランチとの比較に必要

      - name: Detect changes
        id: diff
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD > changed_files.txt
          {
            grep -qE '^quiz-app/.*\.go$|^quiz-app/go\.(mod|sum)$' changed_files.txt \
              && echo "go=true" || echo "go=false"
            grep -qE '^quiz-app/.*\.go$|^quiz-app/go\.(mod|sum)$|^quiz-app/Makefile$' changed_files.txt \
              && echo "wasm=true" || echo "wasm=false"
            grep -qE '^quiz-app/terraform/' changed_files.txt \
              && echo "terraform=true" || echo "terraform=false"
          } >> "$GITHUB_OUTPUT"

  # Go ファイルが変更された場合のみ実行
  test-go:
    name: Go Tests
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: quiz-app/go.mod
          cache-dependency-path: quiz-app/go.sum

      - name: Run tests
        working-directory: quiz-app
        # -count=1 でテストキャッシュを無効化し、常に実行を保証する
        run: go test ./internal/... -v -count=1

  # Go ファイルまたは Makefile が変更された場合のみ実行
  build-wasm:
    name: WASM Build Check
    needs: changes
    if: needs.changes.outputs.wasm == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quiz-app
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install TinyGo
        uses: acifani/setup-tinygo@db56321a62b9a67922bb9ac8f9d085e218807bb3  # v2.0.1
        with:
          tinygo-version: "0.40.1"

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: quiz-app/go.mod
          cache-dependency-path: quiz-app/go.sum

      - name: Build WASM
        run: make build

  # Terraform ファイルが変更された場合のみ実行
  test-terraform:
    name: Terraform Validate
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quiz-app/terraform
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85  # v4.0.0
        with:
          terraform_version: "1.9.0"

      # -backend=false でリモートステートや認証なしに構文・構造を検証する
      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate
