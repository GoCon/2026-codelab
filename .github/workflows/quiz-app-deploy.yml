name: quiz-app / Deploy

on:
  push:
    branches:
      - main
    paths:
      - "quiz-app/**"
      - ".github/workflows/quiz-app-deploy.yml"

permissions:
  contents: read

jobs:
  check-secrets:
    name: Check required secrets
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - name: Check Cloudflare secrets
        id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
            echo "::notice::CLOUDFLARE_API_TOKEN が未設定のため Build & Deploy to Cloudflare Pages をスキップします"
          fi

  deploy:
    name: Build & Deploy to Cloudflare Pages
    needs: check-secrets
    if: needs.check-secrets.outputs.available == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install TinyGo
        uses: acifani/setup-tinygo@db56321a62b9a67922bb9ac8f9d085e218807bb3  # v2.0.1
        with:
          tinygo-version: "0.40.1"

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: quiz-app/go.mod
          cache-dependency-path: quiz-app/go.sum

      - name: Build WASM
        working-directory: quiz-app
        run: make build

      - name: Migrate D1 schema
        working-directory: quiz-app
        run: |
          npx wrangler@latest d1 execute quiz-db \
            --file=schema.sql \
            --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        working-directory: quiz-app
        run: |
          npx wrangler@latest pages deploy dist \
            --project-name=quiz-app \
            --branch=main \
            --commit-hash=${{ github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
