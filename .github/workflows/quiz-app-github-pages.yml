name: quiz-app / GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "quiz-app/public/index.html"
      - "quiz-app/public/quiz-config.js"
      - "quiz-app/Makefile"
      - ".github/workflows/quiz-app-github-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: quiz-app-github-pages
  cancel-in-progress: true

jobs:
  check-config:
    name: Check required config
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - name: Check Pages variables
        id: check
        env:
          API_BASE_URL: ${{ vars.QUIZ_API_BASE_URL }}
        run: |
          if [ -n "$API_BASE_URL" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Repository variable QUIZ_API_BASE_URL が未設定のため GitHub Pages デプロイをスキップします"
          fi

  build:
    name: Build GitHub Pages site
    needs: check-config
    if: needs.check-config.outputs.available == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745  # v5

      - name: Build public site
        working-directory: quiz-app
        env:
          QUIZ_API_BASE_URL: ${{ vars.QUIZ_API_BASE_URL }}
        run: |
          make build-pages
          printf 'window.__QUIZ_APP_CONFIG__ = Object.assign(window.__QUIZ_APP_CONFIG__ || {}, {\n  apiBaseUrl: "%s"\n});\n' "$QUIZ_API_BASE_URL" > gh-pages-dist/quiz-config.js

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b  # v4
        with:
          path: quiz-app/gh-pages-dist

  deploy:
    name: Deploy GitHub Pages site
    needs:
      - check-config
      - build
    if: needs.check-config.outputs.available == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
