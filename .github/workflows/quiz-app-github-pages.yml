name: quiz-app / GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "quiz-app/public/**"
      - "quiz-app/functions/api/quizes.yaml"
      - "quiz-app/functions/api/code/**"
      - "quiz-app/cmd/generatequizdata/**"
      - "quiz-app/internal/quizdata/**"
      - "quiz-app/Makefile"
      - "quiz-app/go.mod"
      - "quiz-app/go.sum"
      - ".github/workflows/quiz-app-github-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: quiz-app-github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build GitHub Pages site
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00  # v6.0.0
        with:
          go-version-file: quiz-app/go.mod

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745  # v5

      - name: Build public site
        working-directory: quiz-app
        env:
          QUIZ_TELEMETRY_ENDPOINT: ${{ vars.QUIZ_TELEMETRY_ENDPOINT }}
          QUIZ_PREVIEW_UNLOCK_CODE: ${{ vars.QUIZ_PREVIEW_UNLOCK_CODE }}
        run: |
          make build-pages
          node <<'EOF'
          const fs = require('fs');
          const vm = require('vm');
          const sandbox = { window: {} };
          vm.createContext(sandbox);
          vm.runInContext(fs.readFileSync('public/quiz-config.js', 'utf8'), sandbox);

          const defaults = sandbox.window.__QUIZ_APP_CONFIG__ || {};
          const config = {
            ...defaults,
            ...(process.env.QUIZ_TELEMETRY_ENDPOINT ? { telemetryEndpoint: process.env.QUIZ_TELEMETRY_ENDPOINT } : {}),
            ...(process.env.QUIZ_PREVIEW_UNLOCK_CODE ? { previewUnlockCode: process.env.QUIZ_PREVIEW_UNLOCK_CODE } : {}),
          };
          fs.writeFileSync(
            'gh-pages-dist/quiz-config.js',
            `window.__QUIZ_APP_CONFIG__ = Object.assign(window.__QUIZ_APP_CONFIG__ || {}, ${JSON.stringify(config, null, 2)});\n`,
          );
          EOF

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b  # v4
        with:
          path: quiz-app/gh-pages-dist

  deploy:
    name: Deploy GitHub Pages site
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
