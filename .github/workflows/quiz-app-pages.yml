name: quiz-app / Deploy Pages

on:
  push:
    branches:
      - main
    paths:
      - "quiz-app/**"
      - ".github/workflows/quiz-app-build.yml"
      - ".github/workflows/quiz-app-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: quiz-app-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build quiz-app Pages artifact
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quiz-app

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: quiz-app/package-lock.json

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Install dependencies
        run: npm ci

      - name: Run local CI entrypoint
        run: make test

      - name: Build Pages artifact
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Prepare Pages artifact
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: quiz-app/dist

  deploy:
    name: Deploy quiz-app to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
