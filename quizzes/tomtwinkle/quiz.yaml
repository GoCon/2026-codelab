title: "Goクイズ"
author: tomtwinkle
questions:
  # Q1: go test キャッシュ
  - text: |
      go test は、同じコードに対して2回目を実行すると「(cached)」と表示され一瞬で終わります。
      このキャッシュを無視して強制的に再テストするフラグはどれ？
    choices:
      - "go test -nocache"
      - "go test -force"
      - "go test -count=1"
      - "go test -clear"
    answer: 2
    explanation: |
      キャッシュを無効化する専用のフラグはなく、「このテストを1回実行する」という意味の -count=1 を指定するのが、キャッシュ回避の公式イディオムです。
      go clean -testcache でキャッシュ全消去も可能です。

      公式ドキュメント: https://pkg.go.dev/cmd/go#hdr-Testing_flags
    answer_code_ref: "code/q1_answer.go"
    answer_code_play_ref: "https://go.dev/play/p/q3esYHlP6lG"
  # Q2: 型無し定数の精度
  - text: |
      変数を使わず、定数で64ビットの限界を超える巨大な数値を定義するとどうなる？
    question_code_ref: "code/q2_question.go"
    choices:
      - "オーバーフローでコンパイルエラー"
      - "0 になる"
      - "負の最大値にラップアラウンドする"
      - "コンパイルは通る"
    answer: 3
    explanation: |
      Goの「型無し定数」は、コンパイル時には少なくとも256ビットの精度を持ちます。
      変数に代入する段階になって初めて型の限界値のチェックが行われるため、定数同士の計算中であればオーバーフローしません。

      公式仕様: https://go.dev/ref/spec#Constants
      Go Blog: https://go.dev/blog/constants
    answer_code_ref: "code/q2_answer.go"
    answer_code_play_ref: "https://go.dev/play/p/vb4924cUKsl"
  # Q3: スライスの append と backing array
  - text: |
      以下のコードを実行したとき、b の値はどうなる？
    question_code_ref: "code/q3_question.go"
    choices:
      - "[1] のまま"
      - "[2] になる"
      - "[1, 2] になる"
      - "panic が発生する"
    answer: 1
    explanation: |
      a にはまだ容量（cap）に余裕があるため、append しても新しい配列は作られず、裏側の同じ配列が使われます。
      そのため c への操作によって、b が参照しているメモリ領域も 2 に上書きされてしまいます。

      Go Blog (スライスの内部構造): https://go.dev/blog/slices-intro
    answer_code_ref: "code/q3_answer.go"
    answer_code_play_ref: "https://go.dev/play/p/Sk6S3nWW0eh"
  # Q4: defer in loop
  - text: |
      以下のコードの問題点は？
    question_code_ref: "code/q4_question.go"
    choices:
      - "ループごとにファイルが上書きされる"
      - "defer は関数の終了時に実行されるため、ファイルディスクリプタが枯渇する"
      - "os.Open は defer で閉じることができない"
      - "コンパイルエラーになる"
    answer: 1
    explanation: |
      defer のスコープは「ブロック」ではなく「関数」です。
      ループの中で defer を大量に呼ぶと、関数が終わるまで一切クローズされず、OSのリソース制限に引っかかってパニックになることがあります。
      解決策はループ本体を別関数に切り出すことです。

      Go Blog (defer の仕様): https://go.dev/blog/defer-panic-and-recover
      公式仕様: https://go.dev/ref/spec#Defer_statements
    answer_code_ref: "code/q4_answer.go"
    answer_code_play_ref: "https://go.dev/play/p/hM0PTI0iko7"
  # Q5: clear() on slice
  - text: |
      以下のコードの実行結果は？
    question_code_ref: "code/q5_question.go"
    choices:
      - "0"
      - "3"
      - "nil"
      - "コンパイルエラー"
    answer: 1
    explanation: |
      Go 1.21 で追加された組み込み関数 clear()。
      マップに使うと要素を空（len=0）にしますが、スライスに使うと長さ（len）と容量（cap）はそのままに、全要素を「ゼロ値」に上書きします。
      要素自体が消えるわけではありません。

      公式仕様 (clear): https://go.dev/ref/spec#Clear
      pkg.go.dev: https://pkg.go.dev/builtin#clear
    answer_code_ref: "code/q5_answer.go"
    answer_code_play_ref: "https://go.dev/play/p/NkAkv-tUNKr"
  # Q6: named return + defer
  - text: |
      以下の関数を呼び出したとき、呼び出し元が受け取る値は？
    question_code_ref: "code/q6_question.go"
    choices:
      - "0"
      - "1"
      - "2"
      - "コンパイルエラー"
    answer: 2
    explanation: |
      名前付き戻り値の罠です。
      return 1 が実行されると、まず変数 n に 1 が代入され、その後に defer が実行されて n が 2 になり、それが返されます。
      実行順序: return 1 → n=1 代入 → defer で n++ → n=2 が返る

      Go Blog (defer の仕様): https://go.dev/blog/defer-panic-and-recover
      公式仕様: https://go.dev/ref/spec#Return_statements
    answer_code_ref: "code/q6_answer.go"
    answer_code_play_ref: "https://go.dev/play/p/973xesVL17U"
  # Q7: range over string
  - text: |
      以下のコードの出力はどれ？
    question_code_ref: "code/q7_question.go"
    choices:
      - |-
          i=0 v=日
          i=1 v=本
          i=2 v=語
      - |-
          i=0 v=26085
          i=3 v=26412
          i=6 v=35486
      - |-
          i=0 v=230
          i=1 v=151
          i=2 v=165
          i=3 v=230
          i=4 v=156
          i=5 v=172
          i=6 v=232
          i=7 v=170
          i=8 v=158
      - "コンパイルエラー"
    answer: 1
    explanation: |
      Go の string range は UTF-8 デコードを行い、インデックスはバイト位置、値は rune（Unicode コードポイント）です。
      「日」(U+65E5=26085) は index=0、「本」(U+672C=26412) は index=3、「語」(U+8A9E=35486) は index=6 から始まります。
      各漢字は UTF-8 で 3 バイトです。

      Go Blog (文字列と rune): https://go.dev/blog/strings
      公式仕様 (range): https://go.dev/ref/spec#For_range
    answer_code_ref: "code/q7_answer.go"
    answer_code_play_ref: "https://go.dev/play/p/BVyqOwrA1tg"
  # Q8: t.Fatal in goroutine
  - text: |
      テスト goroutine ではない「別途起動した goroutine」の中で t.Fatal() を呼ぶとどうなる？
    question_code_ref: "code/q8_question.go"
    choices:
      - "テストが正しく終了し、失敗としてマークされる"
      - "テストがタイムアウトするまで止まらなくなる"
      - "panic になりプロセスがクラッシュする"
      - "何も起こらずテストは成功扱いになる"
    answer: 1
    explanation: |
      t.Fatal は runtime.Goexit() を呼ぶため、別 goroutine で呼ぶとその goroutine だけが静かに終了し、テスト自体は止まりません。
      Go 1.24 からは go vet で検出されるようになりました。
      正しいアプローチ: goroutine 内では t.Error を使い channel で完了を通知するか、errgroup などを活用します。

      pkg.go.dev (testing.T.Fatal): https://pkg.go.dev/testing#T.Fatal
      Go 1.24 リリースノート: https://go.dev/doc/go1.24
    answer_code_ref: "code/q8_answer.go"
    answer_code_play_ref: "https://go.dev/play/p/uP543Km7JNK"
  # Q9: GOMAXPROCS in containers
  - text: |
      Docker や Kubernetes 上で Go アプリを動かす際、CPU のコア数を認識させて GOMAXPROCS を最適化するために、
      最新の Go バージョンにおいて推奨されるコードはどれ？
    choices:
      - 'import _ "go.uber.org/automaxprocs" を入れる'
      - "環境変数 GOMAXPROCS をシェルで計算して渡す"
      - "runtime.GOMAXPROCS(runtime.NumCPU()) を呼ぶ"
      - "何もしなくてよい"
    answer: 3
    explanation: |
      長年 Uber の automaxprocs を入れるのが Kubernetes 時代の定石でしたが、
      Go 1.25 からランタイムがコンテナの CPU 制限（cgroup CPU quota）を自動検知するようになったため、完全に不要になりました。

      Go 1.25 リリースノート: https://go.dev/doc/go1.25
      pkg.go.dev (runtime.GOMAXPROCS): https://pkg.go.dev/runtime#GOMAXPROCS
    answer_code_ref: "code/q9_answer.go"
    answer_code_play_ref: "https://go.dev/play/p/3Az4nyarOeI"
  # Q10: synctest isolation
  - text: |
      synctest.Run ブロックの「外側」で起動した goroutine と、「内側」で起動した goroutine 同士が
      channel で同期通信しようとするとどうなる？
    question_code_ref: "code/q10_question.go"
    choices:
      - "正常に通信できる"
      - "外側の goroutine が強制終了させられる"
      - "deadlock を検知して panic する"
      - "常に非同期通信（buffered channel）に変換される"
    answer: 2
    explanation: |
      synctest は独自の仮想時計とスケジューラ内で隔離されて動くため、リアルタイムで動く通常の goroutine や本物のネットワーク I/O と直接的な同期通信を行おうとすると、テストの決定性が壊れるためエラーとなります。

      pkg.go.dev (testing/synctest): https://pkg.go.dev/testing/synctest
      Go Blog (synctest): https://go.dev/blog/synctest
      Go 1.24 リリースノート: https://go.dev/doc/go1.24
  # Q11: Go keyword
  - text: |
      この中から Go の keyword を選択してください。
    choices:
      - "new"
      - "goto"
      - "nil"
      - "error"
    answer: 1
    explanation: |
      goto だけが Go の keyword です。
      new は組み込み関数、nil は事前宣言済み識別子、error は事前宣言済みのインターフェース型で、いずれも keyword ではありません。

      公式仕様 (Keywords): https://go.dev/ref/spec#Keywords
      公式仕様 (Predeclared identifiers): https://go.dev/ref/spec#Predeclared_identifiers
  # Q12: time.Format の指定方法
  - text: |
      Go の time.Format で時刻レイアウトを指定する方法として正しいのはどれ？
    choices:
      - "1970-01-02"
      - "0001-02-03"
      - "2006-01-02"
      - "1999-12-31"
    answer: 2
    explanation: |
      Go の time.Format / time.Parse は、独自のフォーマット記号ではなく基準時刻
      "Mon Jan 2 15:04:05 MST 2006" を並べたレイアウト文字列で指定します。
      たとえば "2006-01-02" は年-月-日、"15:04:05" は時:分:秒を表します。

      pkg.go.dev (time): https://pkg.go.dev/time
  # Q13: Go の初期メンバー
  - text: |
      Go 言語は Google のエンジニアによって作られましたが、初期メンバーの中には
      IT の歴史を作った「生きる伝説」とも呼べる偉大なプログラマが含まれています。
      それは誰でしょう？
    choices:
      - "Linus Torvalds"
      - "Ken Thompson"
      - "Guido van Rossum"
      - "James Gosling"
    answer: 1
    explanation: |
      正解は Ken Thompson です。Go の作者としては Robert Griesemer、Rob Pike、
      Ken Thompson の 3 名が知られています。
      Ken Thompson は Bell Labs で Unix を共同開発したことで特に有名で、
      その流れの中で C 言語のもとになった B 言語の設計や Plan 9 の開発にも関わった、
      計算機史に残るプログラマです。
      システムソフトウェアの設計に深く関わってきた人物が、Go の初期設計メンバーにも入っています。

      Go FAQ: https://go.dev/doc/faq#history
  # Q14: goroutine の初期メモリ消費
  - text: |
      ゴルーチンは 1 つ起動するのに、初期状態でどれくらいのメモリを消費すると考えるのが近いでしょうか？
    choices:
      - "約 2 KB"
      - "約 64KB"
      - "約 1MB"
      - "OS スレッドと同じ数 MB"
    answer: 0
    explanation: |
      goroutine は軽量で、初期スタックはごく小さく、現行ランタイムでは約 2 KB から始まります。
      必要に応じてスタックが伸縮するため、大量の goroutine を比較的低コストで扱えます。

      Go FAQ (Goroutines): https://go.dev/doc/faq#goroutines
  # Q15: Go で禁止されているポインタ操作
  - text: |
      Go 言語には C 言語でおなじみの「ポインタ」がありますが、
      C 言語では当たり前にできて、Go 言語では安全のために意図的にできなくしているポインタ操作はどれでしょう？
    choices:
      - "ポインタに整数を足し引きして任意のアドレスへ進める"
      - "変数のアドレスを取得する"
      - "ポインタ経由で値を書き換える"
      - "nil と比較する"
    answer: 0
    explanation: |
      Go では安全性を保つため、通常のコードでポインタ演算はできません。
      変数のアドレス取得、参照先の読み書き、nil との比較はできますが、
      C 言語のようなポインタの加減算は `unsafe` を使わない限り行えません。

      Go FAQ (Why is there no pointer arithmetic?): https://go.dev/doc/faq#no_pointer_arithmetic
      pkg.go.dev (unsafe): https://pkg.go.dev/unsafe
  # Q16: Go コンパイラの特徴
  - text: |
      他のコンパイル言語と比較した場合の Go 言語のコンパイラの特徴として正しいのはどれ？
    choices:
      - "コンパイラがワーニングを出さない"
      - "fmt.Printf の書式指定ミスのような問題は、コンパイラが error にする"
      - "実行時にだけ型チェックを行う"
      - "コンパイル時に自動でメモリリークを検出する"
    answer: 0
    explanation: |
      Go のコンパイラは「警告を出して通す」のではなく、問題があればエラーとして止める方針です。
      たとえば未使用の変数や import は warning ではなく compile error になります。
      fmt.Printf の書式指定ミスのような、より高度な静的解析は `go vet` の役割です。

      Go FAQ (Can I stop these complaints about my unused variable/import?): https://go.dev/doc/faq#unused_variables_and_imports
      pkg.go.dev (go vet): https://pkg.go.dev/cmd/vet
  # Q17: Gopher のデザイナー
  - text: |
      愛らしいマスコット「Gopher」君ですが、このキャラクターをデザインしたのは誰でしょう？
    choices:
      - "Renée French"
      - "Rob Pike"
      - "Ken Thompson"
      - "Russ Cox"
    answer: 0
    explanation: |
      Go のマスコットである Gopher をデザインしたのは Renée French です。
      Renée French は Rob Pike の妻でもあります。
      Gopher は Go コミュニティを象徴するキャラクターとして広く親しまれています。

      The Go Gopher: https://go.dev/blog/gopher
