questions:
  # 予約語 or 事前定義識別子
  - text: "Goの予約語ではないものはどれ？"
    choices:
      - "go"
      - "nil"
      - "goto"
      - "fallthrough"
    answer: 1
    explanation: |
      Goの予約語は次の25個のみです:
      break case chan const continue default defer else
      fallthrough for func go goto if import interface map
      package range return select struct switch type var

      nilの他、trueやfalseのような定数、stringやerrorのような型名は、予約語ではなく「事前定義識別子（Predeclared identifier）」で、変数名などに使うことができます（当然推奨されません）。

  # errors.Joinの扱い
  - text: "非nilとなるerrorはどれ？"
    question_code_ref: "code/q2_question.go"
    choices:
      - "すべてnil"
      - "err1のみnil"
      - "err3のみ非nil"
      - "すべて非nil"
    answer: 2
    explanation: |
      複数の error をまとめる標準パッケージの関数 errors.Join は、引数に非nilなerrorが一つもないときはnilを返します。
      この問題では、f2()の戻り値は*MyErr型のtyped nilであるため、非nilです。
    answer_code_ref: "code/q2_answer.go"
    answer_code_play_ref: "https://go.dev/play/p/g-_VO1PYt6b"

  # generics
  - text: "型パラメータ付き関数「MyFunc」の引数にできない型はどれ？"
    question_code_ref: "code/q3_question.go"
    choices:
      - "[]MyType1"
      - "[]MyType2"
      - "[]MyType3"
      - "[]MyType4"
    answer: 2
    explanation: |
      MyFuncの引数は型制約によりMyIfaceを実装している型のスライスとなっています。
      MyIface、つまりm1()メソッドの実装があるのはMyType1のみですが、MyType2はMyType1の単なる別名であり、またMyType4は埋め込みによりインターフェイスを満たします。
      一方、新たな型として定義しているMyType3はm1()メソッドが無いため、MyFuncの引数にはできません。

      Genericsが使えるようになったことで、このようなスライスを受け取る関数を利用するときにスライスを詰め直したり、型ごとに関数を用意する必要がなくなりました。
