    # 正解の index (0-indexed)
    answer: 2
    # 解説
    explanation: "defer の引数は登録時点で評価される。defer fmt.Println(\"defer:\", x) が登録された時点で x=0 がコピーされる。defer の実行は return の後なので出力順は return: 42 → defer: 0。"
